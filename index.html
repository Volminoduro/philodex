// LA JOUTE — moteur de combat
// ══════════════════════════════════════════════════════════════════════════════
// Rien n'est inventé ici : les six statistiques portent déjà leur rôle, et les
// concepts portent déjà leur catégorie.
//
//   INFLUENCE  réserve  « combien de coups le système peut absorber avant
//                         d'être abandonné par l'histoire » — ce sont les PV
//   RIGUEUR    attaque  argument immanent, qui se bat dans le champ adverse
//   ANCRAGE    défense  ce qui résiste à l'argument immanent
//   PORTÉE     attaque  argument transcendant, qui récuse le cadre
//   CLÔTURE    défense  ce qui résiste au changement de cadre
//   CLARTÉ     vitesse  qui parle en premier
//
// Un concept immanent passe par la table des types : il peut valoir ×2, être
// réduit de moitié, ne rien donner du tout — ou tomber dans le vide quand les
// deux champs sont incommensurables. Un concept transcendant ignore la table :
// il ne discute pas le contenu, il attaque le terrain. C'est la réponse à
// l'incommensurabilité, et c'est ce qui fait tenir les deux catégories
// ensemble.
//
// Les clés de statistiques sont identiques en français et en anglais dans
// philomon.js ; seules les infobulles sont traduites.
const ST = { PV:'INFLUENCE', ATK_I:'RIGUEUR', DEF_I:'ANCRAGE', ATK_T:'PORTÉE', DEF_T:'CLÔTURE', VIT:'CLARTÉ' };

// Les vies n'ont pas la même longueur : Nietzsche s'arrête au niveau 25,
// Chomsky en est à 82. Prendre le niveau brut ferait du combat un test de
// longévité — Socrate écrasait Nietzsche en un coup. Le combat se joue donc sur
// l'avancement dans la vie, pas sur le nombre d'années : accompli, chacun se
// bat au niveau effectif 50 ; débutant, au niveau 5. Le niveau biographique
// reste celui qu'on lit à l'écran.
function jLvlEff(p, lvl) {
  const max = lvlMaxOf(p);
  const t = max > 1 ? Math.min(1, Math.max(0, (lvl - 1) / (max - 1))) : 1;
  return Math.max(5, Math.round(5 + 45 * t));
}

function jPV(p, lvl) {
  const L = jLvlEff(p, lvl);
  return Math.floor(2 * p.stats[ST.PV] * L / 100) + L + 10;
}
function jStat(p, lvl, cle) { return statsAt(p, lvl)[cle] || 1; }
function jTypes(p, lvl) { return typesAt(p, stageIndexAtLevel(p, lvl)); }

function ppDe(puiss) { return puiss >= 90 ? 8 : puiss >= 80 ? 10 : 12; }

// L'arsenal disponible à ce niveau : les concepts hérités comptent, les
// concepts reniés ne comptent plus. Le jeune Marx dispose de la dialectique de
// Hegel ; le Marx mûr a perdu l'aliénation de Feuerbach.
function jMoves(p, lvl) {
  const out = movePool(p).filter(mv => moveState(mv, lvl) === 'actif').map(mv => ({
    nom: mv.c.nom, type: mv.c.type, cat: mv.c.cat, puiss: mv.c.puissance,
    src: mv.src, prov: mv.prov, pp: ppDe(mv.c.puissance), ppMax: ppDe(mv.c.puissance),
  }));
  return out.length ? out : [{
    nom: t('jFallbackMove'), type: null, cat: 'immanent', puiss: 30,
    src: null, pp: 99, ppMax: 99, fallback: true,
  }];
}

// Un argument immanent trouve prise de deux façons : la table déclare un
// rapport entre les deux types — y compris par-dessus les champs, comme
// Rationalisme contre Mysticisme —, ou bien les deux se tiennent dans le même
// champ, auquel cas ils peuvent discuter sans que l'un ait l'avantage.
// Faute des deux, les discours passent l'un à côté de l'autre.
//
// La table ne renseigne que 202 couples sur 3025 : s'en tenir à elle rendait
// 86 % des attaques immanentes inertes et le transcendant gagnait 81 % des
// duels. Le champ partagé rattrape ce que la table ne dit pas.
function jTypeMult(attType, defTypes) {
  const tc = PHILOMON_DATA.typechart;
  if (!attType) return { mult: 1, incomm: false };
  let mult = 1, entree = false;
  for (const dt of defTypes) {
    const v = tc[attType] && tc[attType][dt];
    if (v !== undefined) { mult *= v; entree = true; }
  }
  const champA = champOf(attType);
  const memeChamp = defTypes.some(dt => champOf(dt) === champA);
  return { mult, incomm: !entree && !memeChamp };
}

// alea = null pour l'estimation affichée dans les boutons ; sinon on tire.
function jDegats(att, lvlA, def, lvlD, mv, alea) {
  const immanent = mv.cat === 'immanent';
  const A = jStat(att, lvlA, immanent ? ST.ATK_I : ST.ATK_T);
  const D = jStat(def, lvlD, immanent ? ST.DEF_I : ST.DEF_T);
  let mult = 1, note = null;

  if (immanent) {
    const r = jTypeMult(mv.type, jTypes(def, lvlD));
    // ×0,5 et non ×0 : parler à côté n'est pas ne rien dire.
    if (r.incomm)          { mult = 0.5;  note = 'incomm'; }
    else if (r.mult === 0) { mult = 0;    note = 'nul'; }
    else                     mult = r.mult;
    // Un argument immanent porté depuis son propre sol frappe plus fort.
    if (mv.type && jTypes(att, lvlA).includes(mv.type)) mult *= 1.5;
  } else {
    note = 'cadre';
  }

  // ×1,5 sur la défense : dans ce corpus la RIGUEUR dépasse l'ANCRAGE de douze
  // points en moyenne, et sans correction tout le monde s'effondre en deux tours.
  // Le rapport est borné parce que les défenses vont de 18 à 95 : la CLÔTURE de
  // Nietzsche est à 25, et sans borne le moindre argument transcendant le
  // pulvérisait. Bridé, il l'ébranle encore très fort — ce qui est la bonne
  // lecture.
  const ratio = Math.min(2.2, Math.max(0.4, A / (D * 1.5)));
  const L = jLvlEff(att, lvlA);
  const r = alea === null ? 1 : 0.85 + Math.random() * 0.15;
  const brut = ((2 * L / 5 + 2) * mv.puiss * ratio / 85 + 2) * mult * r;
  return { degats: mult === 0 ? 0 : Math.max(1, Math.round(brut)), mult, note };
}

const JOUTE = {
  vous:null, adv:null, lvlVous:1, lvlAdv:1, cote:'vous',
  pvVous:0, pvAdv:0, mvVous:[], mvAdv:[],
  mode:'duel', arene:[], manche:0, enCours:false, verrou:false,
};

function jouteOuverte() { return document.getElementById('joute-screen').classList.contains('open'); }

function openJoute() {
  document.getElementById('joute-screen').classList.add('open');
  document.body.style.overflow = 'hidden';
  jouteSetupPhase();
  jRenderPickGrid();
  jRefreshSetup();
  jApplyLangJoute();
}

function closeJoute() {
  document.getElementById('joute-screen').classList.remove('open');
  document.body.style.overflow = '';
}

function jouteSetupPhase() {
  document.getElementById('joute-setup').classList.add('on');
  document.getElementById('joute-field').classList.remove('on');
  document.getElementById('joute-manche').textContent = '';
}

// ── Préparation ─────────────────────────────────────────────────────────────
let joutePickBuilt = false;

function jRenderPickGrid() {
  const grid = document.getElementById('joute-pick-grid');
  if (joutePickBuilt) return;
  joutePickBuilt = true;
  PHILOMON.forEach(p => {
    const card = document.createElement('div');
    card.className = 'joute-pick-card';
    card.dataset.nom = (p.nom + ' ' + p.full).toLowerCase();
    const sp = document.createElement('div'); sp.className = 'jp-sprite';
    sp.appendChild(placeholderCanvas(56));
    getSprite(p, 56).then(c => { sp.innerHTML = ''; sp.appendChild(c); });
    card.appendChild(sp);
    const nm = document.createElement('div'); nm.className = 'joute-pick-name'; nm.textContent = p.nom;
    card.appendChild(nm);
    card.addEventListener('click', () => jChoisir(p));
    grid.appendChild(card);
  });
}

function jChoisir(p) {
  if (JOUTE.cote === 'vous') { JOUTE.vous = p; JOUTE.lvlVous = lvlMaxOf(p); JOUTE.cote = 'adv'; }
  else                       { JOUTE.adv  = p; JOUTE.lvlAdv  = lvlMaxOf(p); JOUTE.cote = 'vous'; }
  jRefreshSetup();
}

function jRefreshSetup() {
  for (const cote of ['vous', 'adv']) {
    const p = JOUTE[cote];
    const slot = document.getElementById('joute-slot-' + cote);
    slot.classList.toggle('active', JOUTE.cote === cote);
    const cv = document.getElementById('joute-canvas-' + cote);
    const nm = document.getElementById('joute-name-' + cote);
    const tp = document.getElementById('joute-types-' + cote);
    const lp = document.getElementById('joute-lvl-' + cote);
    if (!p) {
      cv.innerHTML = '<span class="breed-slot-empty-glyph">?</span>';
      nm.textContent = '—'; tp.innerHTML = ''; lp.innerHTML = '';
      continue;
    }
    const lvl = cote === 'vous' ? JOUTE.lvlVous : JOUTE.lvlAdv;
    const si = stageIndexAtLevel(p, lvl);
    cv.innerHTML = ''; cv.appendChild(placeholderCanvas(80));
    getSprite(p, 80, si).then(c => { cv.innerHTML = ''; cv.appendChild(c); });
    nm.textContent = p.nom;
    tp.innerHTML = jTypes(p, lvl).map(x =>
      `<span class="type-badge ${tClass(x)}" style="font-size:9px;padding:1px 4px">${x.substring(0,5).toUpperCase()}</span>`).join('');
    if (lp.dataset.for !== p.id) {
      lp.dataset.for = p.id;
      lp.innerHTML = `<input type="range" class="lb-range" min="1" max="${lvlMaxOf(p)}" value="${lvl}"
          aria-label="${t('lvlShort')}"><div class="jl-read"></div><div class="jl-forme"></div>`;
      lp.querySelector('input').addEventListener('input', ev => {
        const v = parseInt(ev.target.value, 10);
        if (cote === 'vous') JOUTE.lvlVous = v; else JOUTE.lvlAdv = v;
        jRefreshSetup();
      });
    }
    const inp = lp.querySelector('input');
    if (inp && document.activeElement !== inp) inp.value = lvl;
    lp.querySelector('.jl-read').textContent =
      `${t('lvlShort')} ${lvl} · ${fmtYear(p, yearAt(p, lvl))} · ${jPV(p, lvl)} ${t('jPV')}`;
    lp.querySelector('.jl-forme').textContent = stageCount(p) > 1 ? stageTag(p, si) : '';
  }
  document.getElementById('joute-go').disabled = !(JOUTE.vous && JOUTE.adv);
  document.getElementById('joute-arene').disabled = !JOUTE.vous;
}

// ── Déroulement ─────────────────────────────────────────────────────────────
function jStart(mode) {
  JOUTE.mode = mode;
  JOUTE.enCours = true;
  JOUTE.verrou = false;
  JOUTE.pvVous = jPV(JOUTE.vous, JOUTE.lvlVous);
  JOUTE.pvAdv  = jPV(JOUTE.adv,  JOUTE.lvlAdv);
  JOUTE.mvVous = jMoves(JOUTE.vous, JOUTE.lvlVous);
  JOUTE.mvAdv  = jMoves(JOUTE.adv,  JOUTE.lvlAdv);
  document.getElementById('joute-setup').classList.remove('on');
  document.getElementById('joute-field').classList.add('on');
  document.getElementById('joute-end').classList.remove('on');
  document.getElementById('joute-log').innerHTML = '';
  document.getElementById('joute-manche').textContent = mode === 'arene'
    ? `${t('jRound')} ${JOUTE.manche} / 5` : '';
  jPaintField(true);
  jLog(t('jOpening').replace('%A', JOUTE.vous.nom).replace('%B', JOUTE.adv.nom), 'jl-tour');
  jRenderMoves();
}

// Le combat garde les PV entre les manches : une arène use.
function jStartArene() {
  const pool = PHILOMON.filter(p => p.id !== JOUTE.vous.id);
  const tot = p => Object.values(p.stats).reduce((a, v) => a + v, 0);
  const tirage = [];
  while (tirage.length < 5 && pool.length) {
    tirage.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  tirage.sort((a, b) => tot(a) - tot(b));
  JOUTE.arene = tirage;
  JOUTE.manche = 1;
  JOUTE.adv = tirage[0];
  JOUTE.lvlAdv = lvlMaxOf(JOUTE.adv);
  jStart('arene');
}

function jPaintField(rebuild) {
  for (const cote of ['vous', 'adv']) {
    const p = JOUTE[cote];
    const lvl = cote === 'vous' ? JOUTE.lvlVous : JOUTE.lvlAdv;
    const pv = cote === 'vous' ? JOUTE.pvVous : JOUTE.pvAdv;
    const pvm = jPV(p, lvl);
    document.getElementById('joute-f-nom-' + cote).textContent = p.nom;
    document.getElementById('joute-f-lvl-' + cote).textContent =
      `${t('lvlShort')} ${lvl} · ${fmtYear(p, yearAt(p, lvl))}`;
    document.getElementById('joute-f-types-' + cote).innerHTML = jTypes(p, lvl).map(x =>
      `<span class="type-badge ${tClass(x)}" style="font-size:9px;padding:1px 4px">${x.substring(0,5).toUpperCase()}</span>`).join('');
    document.getElementById('joute-f-pvnum-' + cote).textContent = `${Math.max(0, pv)} / ${pvm}`;
    const fill = document.getElementById('joute-f-pv-' + cote);
    const r = Math.max(0, pv) / pvm;
    fill.style.width = (r * 100) + '%';
    fill.className = 'joute-pv-fill' + (r <= 0.2 ? ' low' : r <= 0.5 ? ' mid' : '');
    if (rebuild) {
      const host = document.getElementById('joute-f-sprite-' + cote);
      const si = stageIndexAtLevel(p, lvl);
      host.innerHTML = ''; host.appendChild(placeholderCanvas(104));
      getSprite(p, 104, si).then(c => { host.innerHTML = ''; host.appendChild(c); });
    }
  }
}

function jLog(txt, cls) {
  const log = document.getElementById('joute-log');
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.innerHTML = txt;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

function jEffLabel(mult, note) {
  if (note === 'incomm') return { cls:'nul', txt:t('jIncomm') };
  if (mult === 0)        return { cls:'nul', txt:t('jNoHold') };
  if (mult >= 2)         return { cls:'fort', txt:t('jDecisive') };
  if (mult < 1)          return { cls:'faible', txt:t('jWeak') };
  return null;
}

function jRenderMoves() {
  const host = document.getElementById('joute-moves');
  host.innerHTML = '';
  JOUTE.mvVous.forEach((m, i) => {
    const est = jDegats(JOUTE.vous, JOUTE.lvlVous, JOUTE.adv, JOUTE.lvlAdv, m, null);
    const eff = jEffLabel(est.mult, est.note);
    const b = document.createElement('button');
    b.className = 'joute-move' + (m.cat === 'transcendant' ? ' transcendant' : '');
    b.disabled = m.pp <= 0 || JOUTE.verrou || !JOUTE.enCours;
    b.innerHTML = `<span class="joute-move-nom">${m.nom}</span>
      <span class="joute-move-meta">
        <span class="${m.type ? tClass(m.type) : ''}">${m.type ? m.type.toUpperCase() : t('jNoType')}</span>
        <span>${m.cat === 'immanent' ? t('jImmanent') : t('jTranscendent')}</span>
        <span>PWR ${m.puiss}</span>
        ${eff ? `<span class="joute-move-eff ${eff.cls}">${eff.txt}</span>` : ''}
        ${m.src ? `<span style="color:#66ddaa">${t(m.prov === 'capture' ? 'takenFrom' : 'inheritedFrom')} ${m.src.nom}</span>` : ''}
        <span class="joute-move-pp">PP ${m.pp}/${m.ppMax}</span>
      </span>`;
    b.addEventListener('click', () => jTour(i));
    host.appendChild(b);
  });
}

// L'ordinateur vise le meilleur dégât attendu, avec assez de bruit pour ne pas
// être parfait — et donc pour rester battable de plusieurs façons.
function jChoixIA() {
  const dispo = JOUTE.mvAdv.filter(m => m.pp > 0);
  if (!dispo.length) return null;
  let best = dispo[0], score = -1;
  for (const m of dispo) {
    const d = jDegats(JOUTE.adv, JOUTE.lvlAdv, JOUTE.vous, JOUTE.lvlVous, m, null).degats;
    const s = d * (0.75 + Math.random() * 0.5);
    if (s > score) { score = s; best = m; }
  }
  return best;
}

function jFrappe(cote, mv) {
  const att = cote === 'vous' ? JOUTE.vous : JOUTE.adv;
  const def = cote === 'vous' ? JOUTE.adv : JOUTE.vous;
  const lvlA = cote === 'vous' ? JOUTE.lvlVous : JOUTE.lvlAdv;
  const lvlD = cote === 'vous' ? JOUTE.lvlAdv : JOUTE.lvlVous;
  const r = jDegats(att, lvlA, def, lvlD, mv, true);
  mv.pp = Math.max(0, mv.pp - 1);

  jLog(t('jUses').replace('%P', `<b>${att.nom}</b>`).replace('%C', `« ${mv.nom} »`));
  if (r.note === 'cadre')  jLog(t('jFrameShift').replace('%P', att.nom), 'jl-nul');
  if (r.note === 'incomm') jLog(t('jIncommLong').replace('%P', def.nom), 'jl-nul');
  if (r.mult === 0)        jLog(t('jNoHoldLong').replace('%D', def.nom).replace('%A', att.nom), 'jl-nul');
  else if (r.mult >= 2)    jLog(t('jDecisiveLong'), 'jl-fort');
  else if (r.mult < 1 && r.note !== 'incomm') jLog(t('jWeakLong'), 'jl-faible');

  if (cote === 'vous') JOUTE.pvAdv -= r.degats; else JOUTE.pvVous -= r.degats;
  if (r.degats > 0) jLog(t('jDamage').replace('%D', def.nom).replace('%N', r.degats));

  const host = document.getElementById('joute-f-sprite-' + (cote === 'vous' ? 'adv' : 'vous'));
  if (host && r.degats > 0) { host.classList.add('touche'); setTimeout(() => host.classList.remove('touche'), 600); }
  jPaintField(false);
  return (cote === 'vous' ? JOUTE.pvAdv : JOUTE.pvVous) <= 0;
}

function jTour(iVous) {
  if (JOUTE.verrou || !JOUTE.enCours) return;
  JOUTE.verrou = true;
  jRenderMoves();

  const mV = JOUTE.mvVous[iVous];
  const mA = jChoixIA();
  const vV = jStat(JOUTE.vous, JOUTE.lvlVous, ST.VIT);
  const vA = jStat(JOUTE.adv,  JOUTE.lvlAdv,  ST.VIT);
  const vousDabord = vV !== vA ? vV > vA : Math.random() < 0.5;

  jLog('— ' + t('jTurn') + ' —', 'jl-tour');
  const sequence = vousDabord ? ['vous', 'adv'] : ['adv', 'vous'];
  let i = 0;
  const suite = () => {
    if (i >= sequence.length) { JOUTE.verrou = false; jRenderMoves(); return; }
    const cote = sequence[i++];
    const mv = cote === 'vous' ? mV : mA;
    if (!mv) { suite(); return; }
    const ko = jFrappe(cote, mv);
    if (ko) { setTimeout(() => jFin(cote === 'vous'), 700); return; }
    setTimeout(suite, 850);
  };
  setTimeout(suite, 250);
}

function jFin(gagne) {
  JOUTE.enCours = false;
  JOUTE.verrou = true;
  jRenderMoves();
  const perdant = gagne ? JOUTE.adv : JOUTE.vous;
  jLog(t('jAbandoned').replace('%P', `<b>${perdant.nom}</b>`), gagne ? 'jl-fort' : 'jl-faible');

  const end = document.getElementById('joute-end');
  end.innerHTML = '';
  end.classList.add('on');
  const bouton = (label, fn, prim) => {
    const b = document.createElement('button');
    b.className = 'joute-mode-btn' + (prim ? ' primary' : '');
    b.textContent = label;
    b.addEventListener('click', fn);
    end.appendChild(b);
  };

  if (JOUTE.mode === 'arene' && gagne && JOUTE.manche < 5) {
    jLog(t('jArenaNext').replace('%N', JOUTE.manche + 1), 'jl-tour');
    bouton(t('jNextRound'), () => {
      JOUTE.manche++;
      JOUTE.adv = JOUTE.arene[JOUTE.manche - 1];
      JOUTE.lvlAdv = lvlMaxOf(JOUTE.adv);
      const garde = JOUTE.pvVous;
      const soin = Math.round(jPV(JOUTE.vous, JOUTE.lvlVous) * 0.3);
      jStart('arene');
      // On repart avec ce qui restait, plus un tiers de souffle.
      JOUTE.pvVous = Math.min(jPV(JOUTE.vous, JOUTE.lvlVous), Math.max(1, garde) + soin);
      jPaintField(false);
      jLog(t('jArenaHeal').replace('%N', soin), 'jl-tour');
    }, true);
  } else if (JOUTE.mode === 'arene' && gagne) {
    jLog(t('jArenaWon').replace('%P', JOUTE.vous.nom), 'jl-fort');
  }
  bouton(t('jAgain'), () => jStart(JOUTE.mode === 'arene' ? 'duel' : JOUTE.mode));
  bouton(t('jBackSetup'), () => { JOUTE.manche = 0; jouteSetupPhase(); jRefreshSetup(); });
}

// ── Câblage ─────────────────────────────────────────────────────────────────
function jApplyLangJoute() {
  document.getElementById('joute-title').textContent = '⚔ ' + t('jTitle');
  document.getElementById('joute-back').textContent = t('back');
  document.getElementById('joute-lbl-vous').textContent = t('jYou');
  document.getElementById('joute-lbl-adv').textContent = t('jFoe');
  document.getElementById('joute-go').textContent = t('jFight');
  document.getElementById('joute-random').textContent = t('jRandom');
  document.getElementById('joute-arene').textContent = t('jArena');
  document.getElementById('joute-search').placeholder = t('search');
  document.querySelectorAll('.joute-open-btn').forEach(b => {
    if (b.id === 'joute-open-desk') b.textContent = '⚔ ' + t('jTitle');
  });
}

document.getElementById('joute-open-desk').addEventListener('click', openJoute);
document.getElementById('joute-open-mob').addEventListener('click', openJoute);
document.getElementById('joute-back').addEventListener('click', closeJoute);
document.getElementById('joute-go').addEventListener('click', () => { JOUTE.manche = 0; jStart('duel'); });
document.getElementById('joute-arene').addEventListener('click', jStartArene);
document.getElementById('joute-random').addEventListener('click', () => {
  const pool = PHILOMON.filter(p => !JOUTE.vous || p.id !== JOUTE.vous.id);
  JOUTE.adv = pool[Math.floor(Math.random() * pool.length)];
  JOUTE.lvlAdv = lvlMaxOf(JOUTE.adv);
  JOUTE.cote = 'vous';
  jRefreshSetup();
});
document.querySelectorAll('.joute-slot').forEach(s =>
  s.addEventListener('click', ev => {
    if (ev.target.closest('.joute-lvlpick')) return;   // le curseur n'est pas un choix de camp
    JOUTE.cote = s.dataset.cote;
    jRefreshSetup();
  }));
document.getElementById('joute-search').addEventListener('input', ev => {
  const q = ev.target.value.toLowerCase();
  document.querySelectorAll('.joute-pick-card').forEach(c => {
    c.style.display = !q || c.dataset.nom.includes(q) ? '' : 'none';
  });
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && jouteOuverte()) closeJoute();
});
