<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philodex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

/* ══════════════════════════════════════════════════════════════════
   DESIGN TOKENS
   ══════════════════════════════════════════════════════════════════ */
:root {
  /* Shell colors */
  --shell-red:    #cc2200;
  --shell-red-hi: #ff5533;
  --shell-red-lo: #881100;
  --shell-darkest:#440000;

  /* App background */
  --bg:           #0d0d1a;
  --bg-mid:       #131325;
  --bg-card:      #0e1428;
  --bg-card-alt:  #060e1e;

  /* LCD screens */
  --lcd-green-bg: #c8d8a0;
  --lcd-green-hi: #d8e8b0;
  --lcd-green-px: #8a9a60;
  --lcd-green-txt:#1a2800;
  --lcd-blue-bg:  #001030;
  --lcd-blue-mid: #001848;
  --lcd-blue-hi:  #002878;

  /* Text */
  --txt-bright:   #e8e4d8;
  --txt-mid:      #9090a8;
  --txt-dim:      #454560;
  --txt-gold:     #f0c840;
  --txt-red:      #ff5533;

  /* Accent */
  --accent:       #2050cc;
  --accent-hi:    #4070ff;

  /* Font stacks */
  --font-pixel:   'Press Start 2P', monospace;
  --font-mono:    'Courier New', 'Consolas', monospace;
  --font-ui:      system-ui, -apple-system, sans-serif;

  /* Sizes — desktop base */
  --fs-xxs:  11px;
  --fs-xs:   14px;
  --fs-sm:   16px;
  --fs-md:   18px;
  --fs-lg:   22px;
  --fs-xl:   27px;
  --fs-2xl:  34px;

  --radius: 6px;
  --gap:    16px;
}

/* ══ RESET ══ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }

body {
  background: var(--bg);
  color: var(--txt-bright);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.6;
}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--lcd-blue-bg); }
::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }

/* ══════════════════════════════════════════════════════════════════
   DESKTOP LAYOUT  (≥ 1024px)
   Three-column fixed-height: sidebar | list | detail
   ══════════════════════════════════════════════════════════════════ */
#app-desktop {
  display: none;
  height: 100vh;
  flex-direction: column;
}

/* Top header bar */
.desk-header {
  flex-shrink: 0;
  background: var(--shell-red);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 20px;
  box-shadow: 0 3px 0 var(--shell-darkest), inset 0 1px 0 var(--shell-red-hi);
}

.desk-header .light-big {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #aaeeff, #0088cc);
  border: 3px solid #005588;
  box-shadow: 0 0 0 3px #003355;
  flex-shrink: 0;
}

.desk-header .lights-sm { display:flex; gap:5px; }
.desk-header .dot {
  width:8px; height:8px; border-radius:50%;
  border: 1.5px solid rgba(0,0,0,.35);
}
.desk-header .dot.r { background:#ff5555; }
.desk-header .dot.y { background:#ffcc00; }
.desk-header .dot.g { background:#44dd44; }

.desk-header .title {
  font-family: var(--font-pixel);
  font-size: 13px;
  color: #ffddcc;
  letter-spacing: .15em;
  text-shadow: 1px 1px 0 var(--shell-darkest);
  margin-right: auto;
}

.desk-header .version {
  font-family: var(--font-pixel);
  font-size: 9px;
  color: #cc8866;
  letter-spacing: .1em;
}

.lang-btn {
  font-family: var(--font-pixel);
  font-size: 11px;
  color: var(--txt-gold);
  background: var(--shell-red-lo);
  border: 1.5px solid var(--txt-gold);
  padding: 5px 9px;
  cursor: pointer;
  letter-spacing: .1em;
  transition: background .15s, color .15s;
}
.lang-btn:hover { background: var(--txt-gold); color: #000; }

/* Main content area */
.desk-body {
  flex: 1;
  display: grid;
  grid-template-columns: 320px 1fr 1fr;
  overflow: hidden;
  gap: 0;
}

/* ── Sidebar ── */
.desk-sidebar {
  background: var(--bg-mid);
  border-right: 1px solid #1a1a30;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  flex-shrink: 0;
  padding: 14px 16px 10px;
  border-bottom: 1px solid #1a1a30;
}

.sidebar-header h2 {
  font-family: var(--font-pixel);
  font-size: 9px;
  color: var(--txt-gold);
  letter-spacing: .12em;
  margin-bottom: 10px;
}

.search-box {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid #1e2a4a;
  border-radius: var(--radius);
  color: var(--txt-bright);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  padding: 8px 12px;
  outline: none;
  transition: border-color .15s;
}
.search-box::placeholder { color: var(--txt-dim); }
.search-box:focus { border-color: var(--accent); }

.filter-section {
  flex-shrink: 0;
  padding: 10px 16px;
  border-bottom: 1px solid #1a1a30;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.filter-field-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.field-label {
  font-family: var(--font-pixel);
  font-size: 9px;
  color: var(--txt-dim);
  letter-spacing: .06em;
  min-width: 58px;
  flex-shrink: 0;
}

.chip {
  font-family: var(--font-pixel);
  font-size: 9px;
  padding: 3px 6px;
  border: 1px solid;
  cursor: pointer;
  letter-spacing: .05em;
  border-radius: 2px;
  opacity: .5;
  transition: opacity .15s, background .15s;
  white-space: nowrap;
}
.chip.active, .chip:hover { opacity: 1; }
.chip.active { background: rgba(255,255,255,.08); }

.sidebar-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px 0;
}

/* Philosopher row in sidebar */
.philo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .1s, border-color .1s;
}
.philo-row:hover { background: rgba(255,255,255,.04); }
.philo-row.active {
  background: rgba(32,80,204,.15);
  border-left-color: var(--accent-hi);
}

.philo-thumb {
  width: 50px; height: 50px;
  flex-shrink: 0;
  image-rendering: pixelated;
  background: var(--lcd-blue-mid);
  border: 1px solid var(--lcd-blue-hi);
  display: flex; align-items: center; justify-content: center;
}
.philo-thumb canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

.philo-info { flex:1; min-width:0; }
.philo-num  { font-size: var(--fs-xxs); color: var(--txt-dim); letter-spacing:.06em; }
.philo-name { font-family: var(--font-pixel); font-size: 11px; color: var(--txt-bright); letter-spacing:.06em; margin: 3px 0; }
.philo-types { display:flex; gap:3px; flex-wrap:wrap; }
.type-badge {
  font-family: var(--font-pixel);
  font-size: 11px;
  padding: 2px 4px;
  border: 1px solid;
  border-radius: 2px;
  letter-spacing: .04em;
}

.philo-gen { font-size: var(--fs-xxs); color: var(--txt-dim); flex-shrink:0; }

/* ── Center column: list grid ── */
.desk-center {
  background: var(--bg);
  border-right: 1px solid #1a1a30;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.center-header {
  flex-shrink: 0;
  padding: 14px 20px 10px;
  border-bottom: 1px solid #1a1a30;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.center-header h2 {
  font-family: var(--font-pixel);
  font-size: 9px;
  color: var(--txt-mid);
  letter-spacing: .1em;
}
.count-badge {
  font-family: var(--font-pixel);
  font-size: 11px;
  color: var(--accent-hi);
  background: rgba(32,80,204,.2);
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid rgba(64,112,255,.3);
}

.card-grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  align-content: start;
}

/* Philosopher card */
.philo-card {
  background: var(--bg-card);
  border: 1px solid #1a2040;
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color .15s, transform .1s, box-shadow .15s;
  overflow: hidden;
  min-height: 230px;
  position: relative;   /* ancre la pastille de tri */
}
.philo-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(32,80,204,.25);
}
.philo-card.active {
  border-color: var(--txt-gold);
  box-shadow: 0 0 0 1px var(--txt-gold);
}

.card-sprite-area {
  background: var(--lcd-green-bg);
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  image-rendering: pixelated;
  position: relative;
  overflow: hidden;
}
/* Scanline texture */
.card-sprite-area::after {
  content:'';
  position:absolute; inset:0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px);
  pointer-events:none;
}
.card-sprite-area canvas { image-rendering:pixelated; image-rendering:crisp-edges; }

.card-body { padding: 10px 12px; }

.card-num  { font-size: var(--fs-xxs); color: var(--txt-dim); letter-spacing:.06em; }
.card-name {
  font-family: var(--font-pixel);
  font-size: 11px;
  color: var(--txt-bright);
  letter-spacing: .06em;
  margin: 4px 0 6px;
}
.card-types { display:flex; gap:3px; flex-wrap:wrap; margin-bottom:6px; }
.card-gen { font-size: var(--fs-xxs); color: var(--txt-dim); }

/* Influence mini-bar */
.card-infl {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.card-infl-label { font-size: var(--fs-xxs); color: var(--txt-dim); white-space:nowrap; }
.card-infl-bar {
  flex: 1;
  height: 4px;
  background: var(--lcd-blue-hi);
  border-radius: 2px;
  overflow: hidden;
}
.card-infl-fill { height:100%; border-radius:2px; transition:width .4s; }

/* ── Right column: detail panel ── */
.desk-detail {
  background: var(--bg-mid);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.detail-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--txt-dim);
}
.detail-empty .arrow {
  font-family: var(--font-pixel);
  font-size: 24px;
  color: #2a2a45;
  animation: pulse 2s ease-in-out infinite;
}
.detail-empty p {
  font-family: var(--font-pixel);
  font-size: 9px;
  letter-spacing: .1em;
  text-align: center;
  line-height: 2.5;
}
@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.8} }

/* Detail content */
.detail-content { display:none; flex-direction:column; height:100%; overflow:hidden; }
.detail-content.visible { display:flex; }

/* Detail top: sprite left + meta right */
.detail-top {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 230px 1fr;
  border-bottom: 1px solid #1a1a30;
}

.detail-sprite-panel {
  background: var(--lcd-green-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  gap: 8px;
  position: relative;
  overflow: hidden;
  border-right: 1px solid #1a1a30;
  min-height: 260px;
}
.detail-sprite-panel::after {
  content:'';
  position:absolute; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px);
  pointer-events:none;
}
.detail-sprite-panel canvas { image-rendering:pixelated; image-rendering:crisp-edges; }

.sprite-num  { font-family:var(--font-pixel); font-size:6px; color:var(--lcd-green-txt); letter-spacing:.06em; }
.sprite-name { font-family:var(--font-pixel); font-size:8px; color:var(--lcd-green-txt); letter-spacing:.08em; }

.infl-row { display:flex; align-items:center; gap:6px; width:100%; }
.infl-lbl { font-family:var(--font-pixel); font-size:5px; color:var(--lcd-green-txt); }
.infl-bar { flex:1; height:5px; background:#8a9a60; border:1px solid #4a5a20; border-radius:2px; overflow:hidden; }
.infl-fill { height:100%; border-radius:2px; transition:width .4s; }
.infl-fill.hi  { background:#44aa00; }
.infl-fill.mid { background:#eeaa00; }
.infl-fill.low { background:#ee2200; }

.sprite-types { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; }

/* ── LIGNES DE VIE / ÉVOLUTION ────────────────────────────────────────────── */
/* L'étiquette de forme apparaît sur deux fonds : l'écran LCD vert du panneau
   de détail, et le bandeau bleu sombre du héros mobile. */
.stage-label { margin-top:5px; font-size:9px; font-weight:bold; letter-spacing:.5px;
  text-align:center; text-transform:uppercase; line-height:1.35; }
.stage-label:empty { display:none; }
.detail-sprite-panel .stage-label { color:#3f5411; }
.mob-hero-meta .stage-label { color:#66ddaa; }

.concept-card.unlearned { opacity:.42; filter:grayscale(.65); }
.concept-learn { display:flex; align-items:center; gap:7px; margin:2px 0 5px; flex-wrap:wrap; }
.learn-lvl { font-size:9px; font-weight:bold; letter-spacing:.5px; color:#001428;
  background:#66ddaa; padding:2px 6px; border-radius:2px; }
.learn-year { font-size:9px; color:#66ddaa; letter-spacing:.5px; }
.learn-locked { font-size:8px; color:#ff8866; border:1px solid #ff886655;
  padding:1px 5px; letter-spacing:.5px; }

/* Provenance d'un concept repris, et marque des concepts abandonnés. */
.learn-from { font-size:8px; letter-spacing:.5px; padding:1px 5px; cursor:pointer;
  border:1px solid currentColor; }
.learn-from.maitre  { color:#66ddaa; }
.learn-from.capture { color:#dd8844; }
.learn-from:hover { filter:brightness(1.4); }
.learn-renounced { font-size:8px; color:#ff5566; border:1px solid #ff556655;
  padding:1px 5px; letter-spacing:.5px; }
.concept-card.renounced { opacity:.5; }
.concept-card.renounced .concept-name { text-decoration:line-through;
  text-decoration-color:#ff556699; }
.lb-drop { top:0; height:6px; background:#ff556655; }
.lb-drop.on { background:#ff5566; }

.evo-section { display:flex; flex-direction:column; gap:16px; }
.evo-head { display:flex; gap:14px; align-items:flex-start; }
.evo-sprite { width:96px; height:96px; flex-shrink:0; border:2px solid #66ddaa55;
  background:#001428; display:flex; align-items:center; justify-content:center; }
.evo-sprite canvas { image-rendering:pixelated; width:96px; height:96px; }
.evo-head-txt { flex:1; min-width:0; }
.evo-stage-rn { font-size:9px; color:#66ddaa; letter-spacing:2px; }
.evo-stage-nom { font-size:14px; font-weight:bold; color:#e8f4ff; letter-spacing:.5px;
  margin:2px 0 6px; }
.evo-stage-types { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
.evo-stage-note { font-size:11px; line-height:1.55; color:#a8c4dd; }

.evo-bounds { display:flex; justify-content:space-between; gap:10px; font-size:8px;
  color:#557799; letter-spacing:.5px; }

/* Statistiques indexées sur le niveau : le liseré creux montre ce qui reste à
   conquérir avant la fin de la vie philosophique. */
.stat-potential { position:absolute; left:0; top:0; height:100%;
  background:repeating-linear-gradient(135deg,#ffffff0e,#ffffff0e 3px,transparent 3px,transparent 6px);
  border-right:1px solid #ffffff26; border-radius:2px; }
.stat-bar { position:relative; }
.stat-bar .stat-fill { position:relative; z-index:1; }
.stat-total-max { color:#557799; font-weight:normal; }
.stat-lvl-note { margin-top:9px; font-size:9px; color:#6688aa; letter-spacing:.4px;
  line-height:1.5; border-top:1px solid #22446655; padding-top:7px; }

/* Barre de vie sous le portrait — présente quel que soit l'onglet ouvert.
   Elle est posée sur l'écran LCD vert clair : elle en prend la palette, sinon
   rien n'est lisible. */
.lifebar { width:100%; margin:8px 0 2px; }
.lifebar:empty { display:none; }
.lb-readout { display:flex; align-items:baseline; justify-content:center; gap:6px; margin-bottom:4px; }
.lb-lvl  { font-size:11px; font-weight:bold; color:var(--lcd-green-txt); letter-spacing:.6px;
  white-space:nowrap; }
.lb-year { font-size:10px; font-weight:bold; color:#3f5411; letter-spacing:.3px;
  white-space:nowrap; }
.lb-track { position:relative; height:22px; }   /* 5px de plus pour la rangée d'objets */
.lb-range { -webkit-appearance:none; appearance:none; width:100%; height:5px; margin:7px 0 0;
  background:var(--lcd-green-px); border:1px solid #4a5a20; border-radius:2px; outline:none;
  position:relative; z-index:2; cursor:pointer; }
.lb-range::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:16px;
  background:var(--lcd-green-txt); border:2px solid var(--lcd-green-hi); cursor:pointer; }
.lb-range::-moz-range-thumb { width:11px; height:16px; background:var(--lcd-green-txt);
  border:2px solid var(--lcd-green-hi); cursor:pointer; border-radius:0; }
.lb-range:focus-visible { box-shadow:0 0 0 2px #4a5a2077; }
.lb-stage, .lb-learn, .lb-drop { position:absolute; width:2px; pointer-events:none; z-index:1; }
.lb-stage { top:4px; height:12px; background:#4a5a2055; }
.lb-stage.on { background:var(--lcd-green-txt); }
.lb-learn { top:0; height:6px; background:#8a6a1055; }
.lb-learn.on { background:#a06000; }

/* ── Objets d'évolution ── */
/* Sur la barre, l'objet est un glyphe et non un trait : on doit le distinguer
   d'une acquisition de concept sans lire l'infobulle. */
/* Violet sombre : sur l'écran vert clair, le violet clair du reste de
   l'interface tombait à 3,1:1. Celui-ci tient 5,8:1. */
.lb-obj { position:absolute; top:14px; z-index:3; font-size:8px; line-height:1;
  color:#5a2a9a55; transform:translateX(-50%); cursor:help; }
.lb-obj.on { color:#5a2a9a; }
.mob-lifebar-row .lb-obj    { color:#c9a0ff55; }
.mob-lifebar-row .lb-obj.on { color:#c9a0ff; }

.evo-arrow.has-obj { display:flex; flex-direction:column; align-items:center;
  gap:1px; color:#c9a0ff; }
.evo-arrow-glyph { font-size:12px; line-height:1; }

.obj-block { display:flex; flex-direction:column; gap:8px; }

.obj-card {
  background:#140f22;
  border:1px solid #3a2a55;
  border-left:3px solid #c9a0ff;
  border-radius:2px;
  padding:9px 11px;
  opacity:.55;
  transition:opacity .15s;
}
.obj-card.acquis { opacity:1; }
.obj-card.reniement { border-left-color:#ff5566; }
.obj-card.eveil     { border-left-color:#66ddaa; }

.obj-top { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.obj-glyph { font-size:14px; color:#c9a0ff; flex-shrink:0; }
.obj-nom {
  font-family:var(--font-pixel);
  font-size:10px;
  color:var(--txt-bright);
  letter-spacing:.05em;
  flex:1;
  min-width:0;
}
.obj-effet {
  font-family:var(--font-pixel);
  font-size:8px;
  letter-spacing:.06em;
  padding:2px 5px;
  border:1px solid;
  border-radius:2px;
  white-space:nowrap;
}
.obj-effet.evolution { color:#c9a0ff; border-color:#c9a0ff66; }
.obj-effet.eveil     { color:#66ddaa; border-color:#66ddaa66; }
.obj-effet.reniement { color:#ff5566; border-color:#ff556666; }

.obj-meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:5px 0 4px; }
.obj-genre { font-size:var(--fs-xxs); color:#c9a0ff99; letter-spacing:.05em; }
.obj-lvl   { font-size:var(--fs-xxs); color:var(--txt-dim); }
.obj-shared {
  font-size:8px;
  color:#c9a0ff;
  border:1px solid #c9a0ff44;
  border-radius:2px;
  padding:1px 5px;
  cursor:pointer;
  letter-spacing:.04em;
}
.obj-shared:hover { background:#c9a0ff22; }

.obj-note { font-size:var(--fs-xs); color:var(--txt-mid); line-height:1.5; }

/* ══ LA JOUTE ══════════════════════════════════════════════════════════════ */
.joute-open-btn {
  font-family:var(--font-pixel); font-size:9px; letter-spacing:.08em;
  background:#5a1030; color:#ff88bb; border:1px solid #ff4488;
  padding:5px 9px; border-radius:2px; cursor:pointer; white-space:nowrap;
}
.joute-open-btn:hover { background:#ff4488; color:#000; }

/* Superposition plein écran : le même écran sert au bureau et au mobile. */
#joute-screen {
  display:none; position:fixed; inset:0; z-index:200;
  background:var(--bg); flex-direction:column; overflow:hidden;
}
#joute-screen.open { display:flex; }

.joute-header {
  flex-shrink:0; display:flex; align-items:center; gap:12px;
  padding:10px 16px; background:var(--bg-mid); border-bottom:1px solid #3a1030;
}
.joute-manche { margin-left:auto; font-family:var(--font-pixel); font-size:9px;
  color:#ff88bb; letter-spacing:.08em; }

/* ── Préparation ── */
.joute-setup, .joute-field { flex:1; min-height:0; display:none; flex-direction:column; }
.joute-setup.on { display:flex; }
/* Le combat se groupe au centre : ni terrain démesuré, ni journal vide. */
.joute-field.on { display:flex; justify-content:center; }

.joute-slots { display:flex; align-items:center; justify-content:center; gap:16px;
  padding:14px 12px 10px; flex-wrap:wrap; flex-shrink:0; }

.joute-slot {
  width:186px; background:var(--bg-card); border:2px solid #223;
  border-radius:var(--radius); padding:9px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:5px;
}
.joute-slot:hover  { border-color:var(--accent); }
.joute-slot.active { border-color:#ff4488; box-shadow:0 0 0 1px #ff448855; }
.joute-slot-label { font-family:var(--font-pixel); font-size:8px; color:var(--txt-dim);
  letter-spacing:.1em; }
.joute-slot.active .joute-slot-label { color:#ff88bb; }
.joute-slot-canvas { width:80px; height:80px; display:flex; align-items:center;
  justify-content:center; background:var(--lcd-green-bg); image-rendering:pixelated; }
.joute-slot-canvas canvas { image-rendering:pixelated; }
.joute-slot-name { font-family:var(--font-pixel); font-size:10px; color:var(--txt-bright);
  letter-spacing:.05em; text-align:center; }
.joute-slot-types { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; }

.joute-lvlpick { width:100%; display:flex; flex-direction:column; gap:3px; margin-top:2px; }
.joute-lvlpick input { width:100%; }
.joute-lvlpick .jl-read { font-size:var(--fs-xxs); color:var(--txt-mid); text-align:center; }
.joute-lvlpick .jl-forme { font-size:8px; color:#66ddaa; text-align:center;
  letter-spacing:.04em; min-height:10px; }

.joute-actions { display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
  padding:0 12px 10px; flex-shrink:0; }
.joute-mode-btn {
  font-family:var(--font-pixel); font-size:9px; letter-spacing:.06em;
  background:transparent; color:#ff88bb; border:1px solid #ff448866;
  padding:7px 12px; border-radius:2px; cursor:pointer;
}
.joute-mode-btn:hover:not(:disabled) { background:#ff448822; border-color:#ff4488; }
.joute-mode-btn.primary { background:#5a1030; border-color:#ff4488; }
.joute-mode-btn:disabled { opacity:.35; cursor:not-allowed; }

.joute-search { margin:0 12px 8px; flex-shrink:0; }
.joute-pick-grid {
  flex:1; min-height:0; overflow-y:auto; padding:0 12px 14px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:8px;
  align-content:start;
}
.joute-pick-card {
  background:var(--bg-card); border:1px solid #1a2040; border-radius:2px;
  padding:5px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px;
}
.joute-pick-card:hover { border-color:#ff4488; }
.joute-pick-card .jp-sprite { width:56px; height:56px; background:var(--lcd-green-bg);
  display:flex; align-items:center; justify-content:center; }
.joute-pick-name { font-family:var(--font-pixel); font-size:8px; color:var(--txt-bright);
  letter-spacing:.04em; text-align:center; }

/* ── Terrain ── */
.joute-board { flex:0 1 340px; min-height:210px; padding:12px 16px;
  display:flex; flex-direction:column; justify-content:space-between; gap:10px;
  background:linear-gradient(180deg,#0d1730 0%,#0a1020 100%); }
.joute-side { display:flex; align-items:center; gap:14px; }
.joute-side.adv  { justify-content:flex-start; }
.joute-side.vous { justify-content:flex-end; }

.joute-sprite { width:104px; height:104px; flex-shrink:0; background:var(--lcd-green-bg);
  border:1px solid #2a3a5a; display:flex; align-items:center; justify-content:center;
  image-rendering:pixelated; }
.joute-sprite canvas { image-rendering:pixelated; }
.joute-sprite.touche { animation:joute-hit .28s steps(2) 2; }
@keyframes joute-hit { 0%{opacity:1} 50%{opacity:.25} 100%{opacity:1} }

.joute-plate { flex:1; max-width:330px; background:#0a1428; border:2px solid #2a4a6a;
  border-radius:3px; padding:7px 10px; }
.joute-plate-top, .joute-plate-bot { display:flex; align-items:center; gap:8px; }
.joute-plate-bot { margin-top:3px; }
.joute-plate-nom { font-family:var(--font-pixel); font-size:10px; color:var(--txt-bright);
  letter-spacing:.05em; flex:1; min-width:0; }
.joute-plate-lvl { font-size:var(--fs-xxs); color:var(--txt-mid); white-space:nowrap; }
.joute-plate-types { display:flex; gap:3px; flex:1; flex-wrap:wrap; }
.joute-plate-pv { font-family:var(--font-pixel); font-size:9px; color:var(--txt-mid);
  white-space:nowrap; }

.joute-pv-bar { height:7px; background:#001428; border:1px solid #2a4a6a;
  border-radius:2px; overflow:hidden; margin-top:5px; }
.joute-pv-fill { height:100%; width:100%; background:#44dd66; transition:width .35s ease; }
.joute-pv-fill.mid { background:#ddbb22; }
.joute-pv-fill.low { background:#dd3344; }

.joute-log {
  flex:0 1 auto; height:124px; overflow-y:auto; padding:8px 14px;
  background:#050a16; border-top:1px solid #2a4a6a; border-bottom:1px solid #2a4a6a;
  font-size:var(--fs-xs); color:var(--txt-mid); line-height:1.6;
}
.joute-log p { margin:0 0 2px; }
.joute-log .jl-fort { color:#44ff88; }
.joute-log .jl-faible { color:#ff8866; }
.joute-log .jl-nul { color:#7799cc; }
.joute-log .jl-tour { color:var(--txt-dim); letter-spacing:.06em; font-size:var(--fs-xxs); }

.joute-moves { flex-shrink:0; display:grid; grid-template-columns:1fr 1fr; gap:7px;
  padding:10px 14px; }
.joute-move {
  text-align:left; background:var(--bg-card-alt); border:1px solid #2a3a5a;
  border-left:3px solid var(--accent); border-radius:2px; padding:7px 9px;
  cursor:pointer; font-family:inherit; color:inherit;
  display:flex; flex-direction:column; gap:3px;
}
.joute-move:hover:not(:disabled) { border-color:#ff4488; background:#1a1030; }
.joute-move:disabled { opacity:.4; cursor:not-allowed; }
.joute-move.transcendant { border-left-color:#cc66ff; }
.joute-move-nom { font-family:var(--font-pixel); font-size:9px; color:var(--txt-bright);
  letter-spacing:.04em; }
.joute-move-meta { display:flex; gap:7px; align-items:center; flex-wrap:wrap;
  font-size:var(--fs-xxs); color:var(--txt-dim); }
.joute-move-pp { margin-left:auto; }
.joute-move-eff { font-size:8px; padding:1px 4px; border:1px solid; border-radius:2px; }
.joute-move-eff.fort  { color:#44ff88; border-color:#44ff8866; }
.joute-move-eff.faible{ color:#ff8866; border-color:#ff886666; }
.joute-move-eff.nul   { color:#7799cc; border-color:#7799cc66; }

.joute-end { flex-shrink:0; display:none; gap:8px; justify-content:center;
  padding:0 14px 14px; flex-wrap:wrap; }
.joute-end.on { display:flex; }

@media (max-width:700px) {
  .joute-sprite { width:76px; height:76px; }
  /* 76 px de portrait + une plaque de 330 débordaient d'un écran de 390. */
  .joute-plate { max-width:none; min-width:0; padding:6px 8px; }
  .joute-side { gap:8px; }
  .joute-plate-nom { font-size:9px; }
  .joute-moves { grid-template-columns:1fr; }
  .joute-board { flex:0 1 auto; min-height:170px; }
  .joute-log { height:88px; }
  .joute-slot { width:150px; }
}

/* ══════════════════════════════════════════════════════════════════
   SHARED DETAIL CONTENT STYLES
   (used in both desktop .detail-tab-body and mobile .mob-tab-body)
   ══════════════════════════════════════════════════════════════════ */

/* Entry text */
.entry-text {
  font-size: var(--fs-sm);
  color: var(--txt-mid);
  line-height: 1.9;
  letter-spacing: .02em;
  max-width: 60ch;
}

/* Stats */
.stat-list { display:flex; flex-direction:column; gap:10px; }
.stat-row { display:flex; align-items:center; gap:10px; }
.stat-key {
  font-family: var(--font-pixel);
  font-size: 9px;
  color: #7799cc;
  width: 100px;
  flex-shrink: 0;
  letter-spacing: .04em;
  position: relative;
  cursor: help;
}

/* ══ STAT TOOLTIP ══ */
.stat-key::after {
  content: attr(data-tip);
  position: absolute;
  left: 0;
  top: calc(100% + 8px);
  width: 220px;
  background: #0a0a1a;
  border: 1px solid #2a3a60;
  border-radius: 4px;
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-mid);
  line-height: 1.6;
  letter-spacing: .02em;
  pointer-events: none;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity .15s, transform .15s;
  z-index: 500;
  white-space: normal;
  box-shadow: 0 4px 20px rgba(0,0,0,.6);
}
/* Arrow */
.stat-key::before {
  content: '';
  position: absolute;
  left: 10px;
  top: calc(100% + 2px);
  border: 5px solid transparent;
  border-bottom-color: #2a3a60;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  z-index: 501;
}
.stat-key:hover::after,
.stat-key:hover::before { opacity: 1; transform: translateY(0); }

/* Role badge on stat rows */
.stat-role {
  font-family: var(--font-pixel);
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 2px;
  border: 1px solid;
  flex-shrink: 0;
  letter-spacing: .05em;
  width: 42px;
  text-align: center;
}

let lang = 'fr';
function t(k) { return I18N[lang][k]; }

// ══════════════════════════════════════════════════════════════════════════════
// LIGNES DE VIE — niveaux, stades, évolution (données dans evolutions.js)
// ══════════════════════════════════════════════════════════════════════════════
// Niveau 1 = début de la vie philosophique. 1 niveau = 1 an.
const NOW_YEAR = new Date().getFullYear();

// Âge auquel le Dex entier est regardé : jeunesse, maturité, ou forme accomplie.
let dexAge = 'FINAL';   // 'JEUNE' | 'MUR' | 'FINAL'

function evoOf(p)      { return (typeof PHILOMON_EVO !== 'undefined' && PHILOMON_EVO[p.id]) || null; }
function stageCount(p) { const e = evoOf(p); return e ? e.stages.length : 1; }
function stageOf(p, si){ const e = evoOf(p); return e ? e.stages[Math.max(0, Math.min(si, e.stages.length - 1))] : null; }
function endYear(p)    { const e = evoOf(p); return e ? (e.fin === null ? NOW_YEAR : e.fin) : NOW_YEAR; }
function lvlMaxOf(p)   { const e = evoOf(p); return e ? endYear(p) - e.debut + 1 : 1; }
function yearAt(p, lvl){ const e = evoOf(p); return e ? e.debut + lvl - 1 : null; }
function isAlive(p)    { const e = evoOf(p); return !!e && e.fin === null; }

// Les années négatives sont avant J.-C. ; « ≈ » signale une chronologie reconstruite.
function fmtYear(p, y) {
  if (y === null || y === undefined) return '';
  const e = evoOf(p);
  const pre = e && e.approx ? '≈' : '';
  return y < 0 ? `${pre}${-y} av. J.-C.` : `${pre}${y}`;
}

// Dernier stade dont le seuil est atteint.
function stageIndexAtLevel(p, lvl) {
  const e = evoOf(p);
  if (!e) return 0;
  let si = 0;
  for (let i = 0; i < e.stages.length; i++) if (lvl >= e.stages[i].lvl) si = i;
  return si;
}

// Stade sous lequel la grille et la liste affichent tout le Dex.
function dexStageIndex(p) {
  const n = stageCount(p);
  if (dexAge === 'JEUNE') return 0;
  if (dexAge === 'MUR')   return Math.floor((n - 1) / 2);
  return n - 1;
}

// Typage porté à ce stade ; le dernier stade est le typage canonique du Philomon.
function typesAt(p, si) {
  const st = stageOf(p, si);
  return (st && st.types && st.types.length) ? st.types : p.types;
}
function dexTypes(p) { return typesAt(p, dexStageIndex(p)); }

// ── CROISSANCE DES STATISTIQUES ─────────────────────────────────────────────
// Les valeurs de philomon.js sont celles du philosophe accompli, au dernier
// niveau. Avant, il n'en tient qu'une part — et toutes ne montent pas au même
// rythme, parce que les six statistiques ne mesurent pas la même chose :
//
//   pool (INFLUENCE) — masse de pensée accumulée. Quasi nulle au début, elle
//        se constitue tard, une fois les grandes œuvres écrites : courbe > 1.
//   atk / def        — force et solidité du système, qui se bâtissent au fil
//        de son élaboration : croissance à peu près régulière.
//   spd (CLARTÉ)     — l'accessibilité d'une plume est largement donnée
//        d'emblée : plancher haut, courbe < 1.
const STAT_GROWTH = {
  pool: { plancher: 0.12, courbe: 1.35 },
  atk:  { plancher: 0.35, courbe: 0.95 },
  def:  { plancher: 0.30, courbe: 0.95 },
  spd:  { plancher: 0.60, courbe: 0.70 },
};

function statsAt(p, lvl) {
  const meta = STAT_META[lang] || STAT_META.fr || {};
  const max = lvlMaxOf(p);
  const t = max > 1 ? Math.min(1, Math.max(0, (lvl - 1) / (max - 1))) : 1;
  const out = {};
  for (const [k, v] of Object.entries(p.stats)) {
    const g = STAT_GROWTH[(meta[k] || {}).role] || STAT_GROWTH.atk;
    out[k] = Math.max(1, Math.round(v * (g.plancher + (1 - g.plancher) * Math.pow(t, g.courbe))));
  }
  return out;
}


// ── LIGNAGE : concepts repris à autrui, concepts reniés ─────────────────────
// Un philosophe ne dispose pas seulement de ses propres concepts. Il reprend
// ceux de ses maîtres — parfois ceux d'un adversaire, pour les retourner — et
// il lui arrive d'en abandonner, les siens comme ceux d'un autre.
function lignageOf(p) {
  return (typeof PHILOMON_LIGNAGE !== 'undefined' && PHILOMON_LIGNAGE[p.id]) || null;
}

const _normNom = n => String(n || '').replace(/\s*[(,].*$/, '').normalize('NFD')
  .replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z]/g, '').toUpperCase();

// Pris à un maître, ou capturé sur un adversaire ?
function provenanceDe(p, m) {
  const cible = [m.nom, m.full, m.full.split(/\s+/).pop()].map(_normNom);
  const cite = list => (list || []).map(_normNom)
    .some(x => cible.some(c => c && x && (c.includes(x) || x.includes(c))));
  return cite(p[lang].filiation.contre) && !cite(p[lang].filiation.maitres) ? 'capture' : 'maitre';
}

// Arsenal complet, trié par ordre d'acquisition : propres et repris mêlés.
function movePool(p) {
  const d = p[lang], lg = lignageOf(p) || {};
  const renie = {};
  for (const r of (lg.renie || [])) renie[(r.de || 'own') + ':' + r.i] = r.lvl;

  const out = d.concepts.map((c, i) => ({
    key: 'own:' + i, c, lvl: learnLevel(p, i), src: null, prov: null,
    renieLvl: renie['own:' + i] === undefined ? null : renie['own:' + i],
  }));
  for (const h of (lg.herite || [])) {
    const m = PHILO_BY_ID[h.de]; if (!m) continue;
    const c = m[lang].concepts[h.i]; if (!c) continue;
    const k = h.de + ':' + h.i;
    out.push({ key: k, c, lvl: h.lvl, src: m, prov: provenanceDe(p, m),
               renieLvl: renie[k] === undefined ? null : renie[k] });
  }
  return out.sort((a, b) => a.lvl - b.lvl || (a.src ? 1 : 0) - (b.src ? 1 : 0));
}

// futur : pas encore acquis · actif : en main · renie : abandonné depuis
function moveState(mv, lvl) {
  if (lvl < mv.lvl) return 'futur';
  return (mv.renieLvl !== null && lvl >= mv.renieLvl) ? 'renie' : 'actif';
}

// Concepts appris au niveau donné (indices dans p[lang].concepts).
function learnLevel(p, i) {
  const e = evoOf(p);
  return e && e.learn && e.learn[i] !== undefined ? e.learn[i] : 1;
}
function knownAtLevel(p, lvl) {
  const d = p[lang];
  return d.concepts.map((_, i) => learnLevel(p, i) <= lvl);
}

// ── OBJETS D'ÉVOLUTION ──────────────────────────────────────────────────────
// Un philosophe ne décide pas toujours de changer : quelque chose lui tombe
// entre les mains. L'effet de l'objet se déduit du niveau où il agit — sur le
// seuil d'un stade il fait évoluer, sur un reniement il retire un concept,
// avant la première évolution il éveille.
const OBJ_GLYPHE = {
  livre:'▤', lettre:'✉', instrument:'⚙', vetement:'❈', lieu:'⌂', image:'▣', matiere:'◍',
};

function effetObjet(p, lvl) {
  const e = evoOf(p);
  if (e && lvl > 1 && e.stages.some(s => s.lvl === lvl)) return 'evolution';
  const lg = lignageOf(p);
  if (lg && (lg.renie || []).some(r => r.lvl === lvl)) return 'reniement';
  return 'eveil';
}

function objetsOf(p) {
  const list = (typeof PHILOMON_OBJETS !== 'undefined' && PHILOMON_OBJETS[p.id]) || [];
  return list.map(o => Object.assign({}, o, { effet: effetObjet(p, o.lvl) }))
             .sort((a, b) => a.lvl - b.lvl);
}

function objetAtLvl(p, lvl) {
  return objetsOf(p).find(o => o.lvl === lvl) || null;
}

// Le plan du panoptique fait évoluer Bentham puis Foucault : un objet peut servir deux fois.
function autresPorteurs(p, ref) {
  const out = [];
  if (!ref || typeof PHILOMON_OBJETS === 'undefined') return out;
  for (const [id, list] of Object.entries(PHILOMON_OBJETS)) {
    if (id === p.id) continue;
    if (list.some(o => o.ref === ref) && PHILO_BY_ID[id]) out.push(PHILO_BY_ID[id]);
  }
  return out;
}

// ══════════════════════════════════════════════════════════════════════════════
// PIXEL ART ENGINE
// ══════════════════════════════════════════════════════════════════════════════
// Wikimedia Commons API — CORS-enabled via ?origin=* (no proxy needed).
// The API returns a thumbnail URL which is then loaded directly into a canvas.
const WIKIMEDIA_API = 'https://commons.wikimedia.org/w/api.php';

async function resolveWikimediaThumb(fileUrl, width = 300) {
  // Extract the filename from the URL (last path segment, URL-decoded)
  const filename = decodeURIComponent(fileUrl.split('/').pop());
  const title = 'File:' + filename;
  const apiUrl = `${WIKIMEDIA_API}?action=query&titles=${encodeURIComponent(title)}&prop=imageinfo&iiprop=url&iiurlwidth=${width}&format=json&origin=*`;
  try {
    const res = await fetch(apiUrl);
    const json = await res.json();
    const pages = json.query.pages;
    const page = Object.values(pages)[0];
    return page?.imageinfo?.[0]?.thumburl || null;
  } catch {
    return null;
  }
}
const GB_PALETTE  = [[15,56,15],[48,98,48],[139,172,15],[155,188,15]];
const GBC_PALETTE = [[8,24,32],[52,104,86],[136,192,112],[224,248,208],[200,76,28],[248,176,104],[168,56,16],[104,32,8],[64,64,64],[144,144,144],[216,216,216],[248,248,248],[32,56,144],[120,168,248],[56,144,200],[200,232,248]];

function nearestColor(r,g,b,pal){let bi=0,bd=1e9;pal.forEach(([pr,pg,pb],i)=>{const d=(r-pr)**2+(g-pg)**2+(b-pb)**2;if(d<bd){bd=d;bi=i;}});return pal[bi];}

function medianCut(pixels,depth=5){
  if(!pixels.length)return[[128,128,128]];let buckets=[pixels];
  for(let d=0;d<depth;d++){const next=[];buckets.forEach(b=>{if(b.length<2){next.push(b);return;}let rn=255,rx=0,gn=255,gx=0,bn=255,bx=0;b.forEach(([r,g,bv])=>{rn=Math.min(rn,r);rx=Math.max(rx,r);gn=Math.min(gn,g);gx=Math.max(gx,g);bn=Math.min(bn,bv);bx=Math.max(bx,bv);});const ax=(rx-rn)>=(gx-gn)&&(rx-rn)>=(bx-bn)?0:(gx-gn)>=(bx-bn)?1:2;b.sort((a,bv)=>a[ax]-bv[ax]);const m=Math.floor(b.length/2);next.push(b.slice(0,m),b.slice(m));});buckets=next;}
  return buckets.map(b=>{if(!b.length)return[128,128,128];const s=b.reduce((a,c)=>[a[0]+c[0],a[1]+c[1],a[2]+c[2]],[0,0,0]);return s.map(v=>Math.round(v/b.length));});
}

function floydSteinberg(data,w,h,pal){
  const err=new Float32Array(w*h*3),out=new Uint8ClampedArray(w*h*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,ei=(y*w+x)*3;const r=Math.max(0,Math.min(255,data[i]+err[ei])),g=Math.max(0,Math.min(255,data[i+1]+err[ei+1])),bv=Math.max(0,Math.min(255,data[i+2]+err[ei+2]));const[nr,ng,nb]=nearestColor(r,g,bv,pal);out[i]=nr;out[i+1]=ng;out[i+2]=nb;out[i+3]=255;const er=r-nr,eg=g-ng,eb=bv-nb;const add=(dx,dy,f)=>{const nx=x+dx,ny=y+dy;if(nx>=0&&nx<w&&ny<h){const e2=(ny*w+nx)*3;err[e2]+=er*f;err[e2+1]+=eg*f;err[e2+2]+=eb*f;}};add(1,0,7/16);add(-1,1,3/16);add(0,1,5/16);add(1,1,1/16);}
  return out;
}

async function pixelizeImage(url, gen) {
  const SZ = gen === 3 ? 64 : 56, SC = 2;
  // Request a thumbnail sized for pixelization (2× the target canvas size)
  const thumbUrl = await resolveWikimediaThumb(url, SZ * 2);
  if (!thumbUrl) return null;

  return new Promise(resolve => {
    const tmp = document.createElement('canvas'); tmp.width = SZ; tmp.height = SZ;
    const ctx = tmp.getContext('2d');
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, SZ, SZ);
      const raw = ctx.getImageData(0, 0, SZ, SZ); let pal;
      if (gen === 1) {
        pal = GB_PALETTE;
        // Desaturate to grayscale before applying the 4-shade GB palette
        for (let i = 0; i < raw.data.length; i += 4) {
          const gr = Math.round(raw.data[i]*.299 + raw.data[i+1]*.587 + raw.data[i+2]*.114);
          raw.data[i] = raw.data[i+1] = raw.data[i+2] = gr;
        }
      } else if (gen === 2) {
        pal = GBC_PALETTE;
      } else {
        // Gen 3: derive a custom 32-color palette from the image via median cut
        const px = [];
        for (let i = 0; i < raw.data.length; i += 4)
          if (raw.data[i+3] > 128) px.push([raw.data[i], raw.data[i+1], raw.data[i+2]]);
        pal = medianCut(px, 5);
      }
      const dith = floydSteinberg(raw.data, SZ, SZ, pal);
      const out = document.createElement('canvas'); out.width = SZ*SC; out.height = SZ*SC;
      const oc = out.getContext('2d'); oc.imageSmoothingEnabled = false;
      for (let y = 0; y < SZ; y++)
        for (let x = 0; x < SZ; x++) {
          const i = (y*SZ+x)*4;
          oc.fillStyle = `rgb(${dith[i]},${dith[i+1]},${dith[i+2]})`;
          oc.fillRect(x*SC, y*SC, SC, SC);
        }
      // Gen 1: overlay a greenish LCD tint
      if (gen === 1) {
        oc.globalCompositeOperation = 'multiply';
        oc.fillStyle = 'rgba(155,188,15,.25)';
        oc.fillRect(0, 0, SZ*SC, SZ*SC);
        oc.globalCompositeOperation = 'source-over';
      }
      resolve(out);
    };
    img.onerror = () => resolve(null);
    img.src = thumbUrl;
  });
}

function placeholderCanvas(size){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d');ctx.fillStyle='#001848';ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#334466';ctx.font=`${Math.floor(size*.22)}px monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('???',size/2,size/2);
  return c;
}

// Sprite cache: key = `${id}_${size}` (in-memory per session)
const spriteCache = {};
// Raw pixelized canvas cache: key = id (size-independent, persisted in localStorage)
const rawCache = {};
// Version du rendu des sprites. À incrémenter dès que la pixelisation change :
// sinon les navigateurs qui ont déjà visité le site continuent de servir les
// anciennes images depuis le localStorage, quel que soit le code.
const RAW_VER = 2;
const LS_RAW  = `pdx_raw_v${RAW_VER}_`;

// canvas.cloneNode(true) does NOT copy pixel data — use drawImage instead
function copyCanvas(src){
  const dst=document.createElement('canvas');dst.width=src.width;dst.height=src.height;
  dst.getContext('2d').drawImage(src,0,0);
  return dst;
}

function canvasFromDataURL(dataURL) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      resolve(c);
    };
    img.onerror = () => resolve(null);
    img.src = dataURL;
  });
}

// In-flight fetch promises: prevents duplicate network requests when sidebar
// and card grid both call getSprite for the same philosopher simultaneously.
const rawFetching = {};

// A stage's picture: its own sourced portrait when one exists, else the base one.
function stageImgUrl(p, si) {
  const st = stageOf(p, si);
  return (st && st.img) || p.imgUrl || null;
}

// La pixelisation reste celle de l'époque, quel que soit le stade : c'est l'ère
// qui fixe la génération, pas l'âge du philosophe.
function stageGen(p) {
  return ERA_PIX[p.era] || 2;
}

// Plusieurs stades partagent le même portrait dès qu'aucun ne lui est propre.
// On les ramène alors à une seule clé de cache : sinon un philosophe sans
// portrait par stade déclenchait autant de téléchargements identiques que de
// formes — et le rendu pouvait diverger si l'un des appels échouait.
function rawKey(p, si) {
  const url = stageImgUrl(p, si);
  const n = stageCount(p);
  for (let i = 0; i < n; i++) if (stageImgUrl(p, i) === url) return `${p.id}_${i}`;
  return `${p.id}_${si}`;
}

async function _fetchRaw(p, si) {
  const k = rawKey(p, si);
  const stored = localStorage.getItem(LS_RAW + k);
  if (stored) {
    const c = await canvasFromDataURL(stored);
    if (c) { rawCache[k] = c; return c; }
  }
  const url = stageImgUrl(p, si);
  if (!url) return null;
  const c = await pixelizeImage(url, stageGen(p));
  if (c) {
    rawCache[k] = c;
    try { localStorage.setItem(LS_RAW + k, c.toDataURL()); } catch(e) {}
  }
  return c || null;
}

async function getRawPixel(p, si) {
  const k = rawKey(p, si);
  if (rawCache[k]) return copyCanvas(rawCache[k]);
  if (!rawFetching[k]) {
    rawFetching[k] = _fetchRaw(p, si).finally(() => delete rawFetching[k]);
  }
  const c = await rawFetching[k];
  return c ? copyCanvas(c) : null;
}

async function getSprite(p, size, si) {
  if (si === undefined) si = dexStageIndex(p);
  const key = `${rawKey(p, si)}_${size}`;
  if (spriteCache[key]) return copyCanvas(spriteCache[key]);
  const c = await getRawPixel(p, si);
  if (!c) {
    const ph = placeholderCanvas(size);
    if (!stageImgUrl(p, si)) spriteCache[key] = ph; // only cache "no image" permanently; URL failures stay retryable
    return copyCanvas(ph);
  }
  const out = document.createElement('canvas'); out.width = size; out.height = size;
  const ctx = out.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.drawImage(c, 0, 0, size, size);
  spriteCache[key] = out;
  return copyCanvas(out);
}

function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
function tClass(tp){return 'tc-'+normalize(tp);}
function fillClass(tp){return 'fill-'+normalize(tp);}
function champOf(tp){for(const[c,d]of Object.entries(CHAMPS))if(d.types.includes(tp))return c;return null;}

function computeDefMatchups(types) {
  const tc = PHILOMON_DATA.typechart;
  const r = { fort: [], faible: [] };
  for (const attType of Object.keys(tc)) {
    let m = 1, relevant = false;
    for (const defType of types) {
      const v = tc[attType]?.[defType];
      if (v !== undefined) { m *= v; relevant = true; }
    }
    if (!relevant) continue;
    if (m >= 2)   r.faible.push({ type: attType });
    else if (m <= 0.5) r.fort.push({ type: attType });
  }
  return r;
}

let activeType   = null;
let activeSearch = '';
let activeEra    = 'ALL';

// ── ORDONNANCEMENT DU DEX ───────────────────────────────────────────────────
// Le Dex se lit par numéro, mais aussi par force : chaque statistique peut
// devenir la clé de tri, et le total les résume. Les valeurs comparées sont
// celles de l'âge sous lequel le Dex est regardé — classer le Dex jeune ne
// donne donc pas le même ordre que le classer accompli, puisque les six
// statistiques ne mûrissent pas au même rythme.
const SORT_KEYS = ['NUM', 'TOTAL', 'INFLUENCE', 'RIGUEUR', 'ANCRAGE', 'PORTÉE', 'CLÔTURE', 'CLARTÉ'];
let dexSort     = 'NUM';
let dexSortDesc = false;   // le numéro se lit dans l'ordre ; les stats, à l'envers

// Les stats du philosophe tel que la grille l'affiche (donc à l'âge du Dex).
function dexStats(p) { return statsAt(p, defaultLevel(p)); }

function sortValue(p) {
  if (dexSort === 'NUM') return parseInt(p.id, 10);
  const s = dexStats(p);
  if (dexSort === 'TOTAL') return Object.values(s).reduce((a, v) => a + v, 0);
  return s[dexSort] || 0;
}

function sortKeyLabel(k) {
  return k === 'NUM' ? t('sortNum') : k === 'TOTAL' ? t('sortTotal') : k.substring(0, 5);
}

function filteredList() {
  const q = activeSearch.toLowerCase();
  const list = PHILOMON.filter(p => {
    const d = p[lang];
    const mq2 = !q || p.nom.toLowerCase().includes(q) || p.full.toLowerCase().includes(q)
               || dexTypes(p).some(tp=>tp.toLowerCase().includes(q))
               || d.concepts.some(c=>c.nom.toLowerCase().includes(q));
    const mt = !activeType || dexTypes(p).includes(activeType);
    const me = activeEra==='ALL' || p.era===activeEra;
    return mq2 && mt && me;
  });
  if (dexSort === 'NUM' && !dexSortDesc) return list;   // l'ordre du Dex, intact
  // À valeur égale, on retombe sur le numéro : le classement reste reproductible.
  return list.sort((a, b) => {
    const d = sortValue(b) - sortValue(a);
    return (dexSortDesc ? d : -d) || (parseInt(a.id, 10) - parseInt(b.id, 10));
  });
}

function buildStatsHtml(p) {

                       (m.role === 'def') ? fillClass(tp0[tp0.length-1]) :

        <div class="stat-bar">
          ${v < plein ? `<div class="stat-potential" style="width:${plein}%"></div>` : ''}

    }).join('')
  }
  <div class="stat-total-row">

  ${lvl < max ? `<div class="stat-lvl-note">${t('statsAtLevel').replace('%L', lvl).replace('%A', fmtYear(p, yearAt(p, lvl)))}</div>` : ''}
  </div>`;
}

function buildMatchupsHtml(p) {
  const cur = typesAt(p, stageIndexAtLevel(p, curLevel(p)));
  const dm = computeDefMatchups(cur);
  const myChamps = [...new Set(cur.map(champOf).filter(Boolean))];
  const other = Object.keys(CHAMPS).filter(c=>!myChamps.includes(c)).map(c=>I18N[lang].champLabels[c]||c);
  let html = '<div class="matchup-section">';
  if (dm.fort.length)  html += `<div><div class="matchup-group-title">${t('resistances')}</div><div class="pill-row">${dm.fort.map(e=>`<div class="pill strong"><span class="${tClass(e.type)}">${e.type.toUpperCase()}</span><span class="mult">×½</span></div>`).join('')}</div></div>`;
  if (dm.faible.length) html += `<div><div class="matchup-group-title">${t('weaknesses')}</div><div class="pill-row">${dm.faible.map(e=>`<div class="pill weak"><span class="${tClass(e.type)}">${e.type.toUpperCase()}</span><span class="mult">×2</span></div>`).join('')}</div></div>`;
  if (other.length) html += `<div class="incommensurable-note">${t('incommensurable')}${other.join(', ')}</div>`;
  return html + '</div>';
}

function buildConceptsHtml(p) {
  const lvl = curLevel(p);
  // Ordre d'acquisition plutôt qu'ordre de saisie : la liste devient une biographie.
  return `<div class="concept-list">${movePool(p).map(mv => {
    const c = mv.c;
    const cLvl = mv.lvl;
    const etat = moveState(mv, lvl);
    const known = etat === 'actif';
    const cType = c.type;
    const isImmanent = c.cat === 'immanent';
    const catLabel = lang === 'fr'
      ? (isImmanent ? 'IMMANENT' : 'TRANSCENDANT')
      : (isImmanent ? 'IMMANENT' : 'TRANSCENDENT');

    // Les matchups offensifs ne valent que pour l'immanent : le transcendant ne
    // se bat pas dans le champ. Ils se lisent dans la table des types, et non
    // dans CHAMPS, qui n'a jamais porté de matchups — d'où une rangée
    // durablement vide avant correction.
    let vsRows = '';
    if (isImmanent) {
      const contre = PHILOMON_DATA.typechart[cType] || {};
      for (const [dt, m] of Object.entries(contre)) {
        if (m === 1) continue;
        const lbl = m >= 2 ? '×2' : m === 0 ? '×0' : '×½';
        vsRows += `
          <span class="vs-lbl">vs</span>
          <span class="vs-pill ${tClass(dt)}">${dt.substring(0,6).toUpperCase()}</span>
          <span class="vs-mult" style="color:${m>=2?'#44ff44':m===0?'#7799cc':'#ff4444'}">${lbl}</span>`;
      }
    } else {
      // Transcendent: always hits CLÔTURE regardless of type
      vsRows = `<span class="vs-lbl">${lang==='fr'?'cible':'targets'}</span>
        <span class="vs-pill" style="border-color:#7799cc;color:#7799cc">CLÔTURE</span>`;
    }

    return `<div class="concept-card${etat === 'actif' ? '' : ' unlearned'}${etat === 'renie' ? ' renounced' : ''}">
      <div class="concept-top">
        <span class="concept-name">
          ${c.nom}
          <span class="concept-cat ${c.cat}">${catLabel}</span>
        </span>
        <span class="concept-pwr">PWR ${c.puissance}</span>
      </div>
      <div class="concept-learn">
        <span class="learn-lvl">${t('lvlShort')} ${cLvl}</span>
        <span class="learn-year">${fmtYear(p, yearAt(p, cLvl))}</span>
        ${mv.src ? `<span class="learn-from ${mv.prov}" data-philo-id="${mv.src.id}">${
          t(mv.prov === 'capture' ? 'takenFrom' : 'inheritedFrom')} ${mv.src.nom}</span>` : ''}
        ${etat === 'futur' ? `<span class="learn-locked">${t('notYetLearned')}</span>` : ''}
        ${etat === 'renie' ? `<span class="learn-renounced">${
          t('renouncedAt').replace('%L', mv.renieLvl).replace('%A', fmtYear(p, yearAt(p, mv.renieLvl)))}</span>` : ''}
      </div>
      <span class="concept-type-tag ${tClass(cType)}">${cType.toUpperCase()}</span>
      <div class="concept-desc">${c.desc}</div>
      ${vsRows ? `<div class="concept-matchup-row">${vsRows}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

// ── ONGLET ÉVOLUTION ────────────────────────────────────────────────────────
// Le curseur parcourt la vie du philosophe ; sprite, typage et concepts suivent.
function buildEvolutionHtml(p) {
  const e = evoOf(p);
  if (!e) return `<p class="entry-text">${t('noEvoData')}</p>`;
  const max = lvlMaxOf(p), lvl = curLevel(p), si = stageIndexAtLevel(p, lvl);
  const st = e.stages[si], sd = st[lang] || st.fr;

  // La flèche porte l'objet quand un objet est ce qui fait franchir le seuil.
  const chainParts = [];
  e.stages.forEach((s, i) => {
    if (i) {
      const o = objetAtLvl(p, s.lvl);
      chainParts.push(o
        ? `<span class="evo-arrow has-obj" title="${(o[lang] || o.fr).nom.replace(/"/g, '&quot;')}">
             <span class="evo-arrow-glyph">${OBJ_GLYPHE[o.genre] || '◆'}</span>▶</span>`
        : '<span class="evo-arrow">▶</span>');
    }
    const nm = (s[lang] || s.fr).nom;
    chainParts.push(`<button class="evo-chip${i === si ? ' on' : ''}" data-evo-lvl="${s.lvl}">
        <span class="evo-chip-rn">${['I','II','III','IV','V'][i] || (i + 1)}</span>
        <span class="evo-chip-nom">${nm}</span>
        <span class="evo-chip-lvl">${t('lvlShort')} ${s.lvl} · ${fmtYear(p, yearAt(p, s.lvl))}</span>
      </button>`);
  });
  const chain = chainParts.join('');

  const objets = objetsOf(p);
  const objHtml = !objets.length ? '' : `
    <div class="obj-block">
      <div class="fil-group-title">${t('objectsTitle')}</div>
      ${objets.map(o => {
        const d = o[lang] || o.fr;
        const partage = autresPorteurs(p, o.ref);
        return `<div class="obj-card ${o.effet}${lvl >= o.lvl ? ' acquis' : ''}">
          <div class="obj-top">
            <span class="obj-glyph ${o.genre}">${OBJ_GLYPHE[o.genre] || '◆'}</span>
            <span class="obj-nom">${d.nom}</span>
            <span class="obj-effet ${o.effet}">${t('eff_' + o.effet)}</span>
          </div>
          <div class="obj-meta">
            <span class="obj-genre">${t('genre_' + o.genre)}</span>
            <span class="obj-lvl">${t('lvlShort')} ${o.lvl} · ${fmtYear(p, yearAt(p, o.lvl))}</span>
            ${partage.map(q => `<span class="obj-shared" data-philo-id="${q.id}">${
              t('sharedWith').replace('%P', q.nom)}</span>`).join('')}
          </div>
          <div class="obj-note">${d.note}</div>
        </div>`;
      }).join('')}
    </div>`;

  return `<div class="evo-section">
    <div class="evo-head">
      <div class="evo-sprite" id="evo-sprite"></div>
      <div class="evo-head-txt">
        ${e.stages.length > 1 ? `<div class="evo-stage-rn">${['I','II','III','IV','V'][si] || (si + 1)}</div>` : ''}
        <div class="evo-stage-nom">${sd.nom}</div>
        <div class="evo-stage-types">${typesAt(p, si).map(tp => `<span class="type-badge ${tClass(tp)}">${tp.toUpperCase()}</span>`).join('')}</div>
        <div class="evo-stage-note">${sd.note || ''}</div>
      </div>
    </div>

    <div class="evo-bounds">
      <span>${t('lvlShort')} 1 · ${fmtYear(p, e.debut)} — ${t('philoStart')}</span>
      <span>${t('lvlShort')} ${max} · ${fmtYear(p, endYear(p))}${isAlive(p) ? ' ·' + t('stillAlive') : ''}</span>
    </div>

    ${e.stages.length > 1
      ? `<div class="evo-chain">${chain}</div>`
      : `<div class="incommensurable-note">${t('singleForm')}</div>`}
    ${objHtml}
    ${e.approx ? `<div class="incommensurable-note">${t('approxNote')}</div>` : ''}
  </div>`;
}

function filTag(name, extraClass = '') {
  const base = name.replace(/\s*[\(,].*$/, '').trim();
  const linked = PHILO_BY_NOM[name] || PHILO_BY_NOM[base];
  const cls = `fil-tag${extraClass ? ' '+extraClass : ''}${linked ? ' linked' : ''}`;
  const attr = linked ? ` data-philo-id="${linked.id}"` : '';
  return `<span class="${cls}"${attr}>${name}</span>`;
}

function buildFiliationHtml(p) {
  const f = p[lang].filiation;
  return `<div class="fil-section">
    <div><div class="fil-group-title">${t('influences')}</div>
    <div class="fil-chain">${f.maitres.map(m=>filTag(m)).join('')}<span class="fil-arrow">▶</span><span class="fil-tag self">${p.nom}</span></div></div>
    <div><div class="fil-group-title">${t('disciples')}</div>
    <div class="fil-chain"><span class="fil-tag self">${p.nom}</span><span class="fil-arrow">▶</span>${f.disciples.map(d=>filTag(d)).join('')}</div></div>
    ${f.contre?.length?`<div><div class="fil-group-title" style="color:#cc4444">${t('oppositions')}</div><div class="fil-chain">${f.contre.map(c=>filTag(c,'hostile')).join('')}</div></div>`:''}
  </div>`;
}

// ── NIVEAU COURANT DU DÉTAIL ────────────────────────────────────────────────
// null = suivre l'âge global du Dex ; sinon, le curseur a la main.
let detailLevel = null;
let detailLevelFor = null;   // id du philosophe auquel detailLevel se rapporte

// Niveau par défaut : l'âge du Dex, lu comme une fraction de la vie
// philosophique — puis ramené à l'intérieur du stade que la grille montre, pour
// que le portrait et les statistiques parlent du même moment. Sans cette
// fraction, un philosophe à forme unique resterait à son niveau maximal même en
// vue « jeune », faute d'un stade antérieur où le situer.
const AGE_FRACTION = { JEUNE: 0.25, MUR: 0.6, FINAL: 1 };

function defaultLevel(p) {
  const e = evoOf(p);
  if (!e) return 1;
  const max = lvlMaxOf(p);
  if (dexAge === 'FINAL') return max;
  const si  = dexStageIndex(p);
  const lo  = e.stages[si].lvl;
  const hi  = si < e.stages.length - 1 ? e.stages[si + 1].lvl - 1 : max;
  const lvl = Math.max(1, Math.round(max * (AGE_FRACTION[dexAge] || 1)));
  return Math.max(lo, Math.min(hi, lvl));
}
function curLevel(p) {
  if (detailLevelFor !== p.id || detailLevel === null) return defaultLevel(p);
  return Math.max(1, Math.min(detailLevel, lvlMaxOf(p)));
}
function setDetailLevel(p, lvl) { detailLevelFor = p.id; detailLevel = lvl; }
function resetDetailLevel(p)    { detailLevelFor = p.id; detailLevel = null; }

function renderTab(tabKey, p, container) {
  const builders = {
    entree: buildEntryHtml,
    stats: buildStatsHtml,
    matchups: buildMatchupsHtml,
    concepts: buildConceptsHtml,
    evolution: buildEvolutionHtml,
    filiation: buildFiliationHtml,
  };
  container.innerHTML = (builders[tabKey]||buildEntryHtml)(p);
  if (tabKey === 'evolution') wireEvolutionTab(p, container);
}

// ── BARRE DE VIE ────────────────────────────────────────────────────────────
// Sous le portrait, quel que soit l'onglet ouvert : le curseur parcourt la vie
// et tout ce qui est à l'écran se recale sur le niveau choisi.
// Construite une seule fois par philosophe : recréer l'<input> à chaque
// mouvement casserait le glissement en cours.
function renderLifebar(p, host) {
  if (!host) return;
  const e = evoOf(p);
  if (!e) { host.innerHTML = ''; host.dataset.for = ''; return; }
  if (host.dataset.for === p.id && host.dataset.lang === lang) { updateLifebar(p, host); return; }

  const max = lvlMaxOf(p);
  const pct = v => max > 1 ? ((v - 1) / (max - 1)) * 100 : 0;
  const marks = e.stages.map(s => `<span class="lb-stage" data-lvl="${s.lvl}" style="left:${pct(s.lvl)}%"></span>`).join('');
  // Ambre : une acquisition. Rouge : un concept abandonné.
  const learns = movePool(p).map(mv => {
    const acquis = `<span class="lb-learn" data-lvl="${mv.lvl}" style="left:${pct(mv.lvl)}%" title="${mv.c.nom} — ${t('lvlShort')} ${mv.lvl}"></span>`;
    const perdu = mv.renieLvl === null ? '' :
      `<span class="lb-drop" data-lvl="${mv.renieLvl}" style="left:${pct(mv.renieLvl)}%" title="${mv.c.nom} — ${t('renouncedShort')}"></span>`;
    return acquis + perdu;
  }).join('');
  // Violet : un objet agit ici.
  const objets = objetsOf(p).map(o => `<span class="lb-obj" data-lvl="${o.lvl}"
    style="left:${pct(o.lvl)}%" title="${(o[lang] || o.fr).nom.replace(/"/g, '&quot;')} — ${
    t('eff_' + o.effet)}">${OBJ_GLYPHE[o.genre] || '◆'}</span>`).join('');

  host.innerHTML = `
    <div class="lb-readout">
      <span class="lb-lvl"></span><span class="lb-year"></span>
    </div>
    <div class="lb-track">${marks}${learns}${objets}
      <input type="range" class="lb-range" min="1" max="${max}" value="${curLevel(p)}"
             aria-label="${t('tabEvolution')}">
    </div>`;
  host.dataset.for = p.id;
  host.dataset.lang = lang;

  host.querySelector('.lb-range').addEventListener('input', ev => {
    setDetailLevel(p, parseInt(ev.target.value, 10));
    refreshDetailForLevel(p);
  });
  updateLifebar(p, host);
}

// Ne touche que le texte et les repères — jamais l'<input> qu'on est en train de traîner.
function updateLifebar(p, host) {
  if (!host || host.dataset.for !== p.id) return;
  const lvl = curLevel(p);
  const lv = host.querySelector('.lb-lvl'), yr = host.querySelector('.lb-year');
  if (lv) lv.textContent = `${t('lvlShort')} ${lvl}`;
  if (yr) yr.textContent = fmtYear(p, yearAt(p, lvl));
  host.querySelectorAll('.lb-stage, .lb-learn, .lb-drop, .lb-obj').forEach(m =>
    m.classList.toggle('on', lvl >= parseInt(m.dataset.lvl, 10)));
  const r = host.querySelector('.lb-range');
  if (r && document.activeElement !== r && r.value !== String(lvl)) r.value = lvl;
}

// Rebranche les pastilles de stade après chaque rendu de l'onglet ÉVOLUTION.
function wireEvolutionTab(p, container) {
  const si = stageIndexAtLevel(p, curLevel(p));
  const holder = container.querySelector('#evo-sprite');
  if (holder) {
    holder.innerHTML = ''; holder.appendChild(placeholderCanvas(96));
    getSprite(p, 96, si).then(c => { holder.innerHTML = ''; holder.appendChild(c); });
  }
  container.querySelectorAll('[data-evo-lvl]').forEach(btn => {
    btn.addEventListener('click', () => {
      setDetailLevel(p, parseInt(btn.dataset.evoLvl, 10));
      refreshDetailForLevel(p);
    });
  });
}

// Le niveau a bougé : on repeint l'en-tête, la barre et l'onglet ouvert.
function refreshDetailForLevel(p) {
  const desktop = document.body.classList.contains('is-desktop');
  if (desktop) {
    paintDesktopHeader(p);
    renderTab(activeDesktopTab, p, document.getElementById('desk-tab-body'));
  } else {
    paintMobileHeader(p);
    renderTab(activeMobileTab, p, document.getElementById('mob-tab-body'));
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// DESKTOP VIEW
// ══════════════════════════════════════════════════════════════════════════════
let selectedPhilo = null;
let activeDesktopTab = 'entree';

function buildDesktop() {
  buildDesktopFilters();
  renderDesktopList();
  applyDesktopLangLabels();
  if (selectedPhilo) openDesktopDetail(selectedPhilo);
  else document.querySelector('.desk-body').classList.add('detail-hidden');
}

// Âge sous lequel tout le Dex est regardé : la grille entière change de forme.
function buildAgeSelector(onChange) {
  const row = document.createElement('div');
  row.className = 'filter-field-row age-row';
  const lbl = document.createElement('span');
  lbl.className = 'field-label';
  lbl.style.color = '#66ddaabb';
  lbl.textContent = t('dexAgeLabel');
  row.appendChild(lbl);
  [['JEUNE', t('ageYoung')], ['MUR', t('ageMature')], ['FINAL', t('ageLate')]].forEach(([k, label]) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (dexAge === k ? ' active' : '');
    chip.style.borderColor = '#66ddaa';
    chip.style.color = '#66ddaa';
    chip.textContent = label;
    chip.addEventListener('click', () => { dexAge = k; onChange(); });
    row.appendChild(chip);
  });
  return row;
}

// Clé de classement du Dex. Re-cliquer la clé active retourne l'ordre.
function buildSortChips(onChange) {
  return SORT_KEYS.map(k => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (dexSort === k ? ' active' : '');
    chip.dataset.sort = k;
    chip.style.borderColor = '#c9a0ff';
    chip.style.color = '#c9a0ff';
    chip.title = t('sortHint');
    chip.textContent = dexSort === k
      ? `${sortKeyLabel(k)} ${dexSortDesc ? '▼' : '▲'}`
      : sortKeyLabel(k);
    chip.addEventListener('click', () => {
      if (dexSort === k) dexSortDesc = !dexSortDesc;
      else { dexSort = k; dexSortDesc = (k !== 'NUM'); }
      onChange();
    });
    return chip;
  });
}

function buildSortSelector(onChange) {
  const row = document.createElement('div');
  row.className = 'filter-field-row sort-row';
  const lbl = document.createElement('span');
  lbl.className = 'field-label';
  lbl.style.color = '#c9a0ffbb';
  lbl.textContent = t('sortLabel');
  row.appendChild(lbl);
  buildSortChips(onChange).forEach(c => row.appendChild(c));
  return row;
}

// Rappel de ce qui est classé, et à quel âge les valeurs ont été prises.
function sortNoteText() {
  if (dexSort === 'NUM') return '';
  const age = { JEUNE: t('ageYoung'), MUR: t('ageMature'), FINAL: t('ageLate') }[dexAge];
  return t('sortNote')
    .replace('%S', dexSort === 'TOTAL' ? t('sortTotal') : dexSort)
    .replace('%D', t(dexSortDesc ? 'sortDesc' : 'sortAsc'))
    .replace('%A', age);
}

// Pastille de valeur : sans elle, l'ordre serait affirmé mais pas montré.
function sortBadge(p, cls) {
  if (dexSort === 'NUM') return null;
  const el = document.createElement('div');
  el.className = cls;
  el.innerHTML = `<span class="sv-num">${sortValue(p)}</span>`
               + `<span class="sv-key">${sortKeyLabel(dexSort)}</span>`;
  return el;
}

function buildDesktopFilters() {
  const el = document.getElementById('desk-filters');
  el.innerHTML = '';

  el.appendChild(buildAgeSelector(() => {
    buildDesktopFilters();
    renderDesktopList();
    if (selectedPhilo) { resetDetailLevel(selectedPhilo); openDesktopDetail(selectedPhilo); }
  }));

  el.appendChild(buildSortSelector(() => {
    buildDesktopFilters();
    renderDesktopList();
  }));

  const eraDiv = document.createElement('div');
  eraDiv.className = 'filter-field-row';
  const eraLabel = document.createElement('span');
  eraLabel.className = 'field-label';
  eraLabel.style.color = '#ffaa00bb';
  eraLabel.textContent = I18N[lang].eraLabel || 'ÈRE';
  eraDiv.appendChild(eraLabel);
  
  const eras = ['ALL', 'ANTIQUE', 'MÉDIÉVALE', 'RENAISSANCE', 'MODERNE', 'CONTEMPORAINE'];
  eras.forEach(era => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeEra===era?' active':'');
    chip.dataset.era = era;
    chip.style.borderColor = '#ffaa00';
    chip.style.color = '#ffaa00';
    chip.textContent = era.substring(0,4).toUpperCase();
    chip.addEventListener('click', () => {
      activeEra = activeEra===era ? 'ALL' : era;
      buildDesktopFilters();
      renderDesktopList();
      if (selectedPhilo && !filteredList().includes(selectedPhilo)) {
        selectedPhilo = null;
        showDesktopEmpty();
      }
    });
    eraDiv.appendChild(chip);
  });
  el.appendChild(eraDiv);
  
  for(const[champ,cd] of Object.entries(CHAMPS)){
    const row = document.createElement('div');
    row.className = 'filter-field-row';
    const lbl = document.createElement('span');
    lbl.className = 'field-label';
    lbl.style.color = cd.color+'bb';
    lbl.textContent = I18N[lang].champLabels[champ] || champ;
    row.appendChild(lbl);
    cd.types.forEach(tp => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (activeType===tp?' active':'');
      chip.dataset.type = tp;
      const typeColor = TYPE_COLORS[tp] || cd.color;
      chip.style.borderColor = typeColor;
      chip.style.color = typeColor;
      chip.textContent = tp.substring(0,5).toUpperCase();
      chip.addEventListener('click', () => {
        activeType = activeType===tp ? null : tp;
        buildDesktopFilters();
        renderDesktopList();
        if (selectedPhilo && !filteredList().includes(selectedPhilo)) {
          selectedPhilo = null;
          showDesktopEmpty();
        }
      });
      row.appendChild(chip);
    });
    el.appendChild(row);
  }
}

function renderDesktopList() {
  const items = filteredList();
  document.getElementById('desk-count').textContent = items.length;
  const note = document.getElementById('desk-sort-note');
  if (note) note.textContent = sortNoteText();

  // Sidebar list
  const sidebar = document.getElementById('desk-sidebar-list');
  sidebar.innerHTML = '';
  items.forEach(p => {
    const row = document.createElement('div');
    row.className = 'philo-row' + (selectedPhilo===p ? ' active':'');
    row.dataset.philoId = p.id;
    const thumb = document.createElement('div'); thumb.className = 'philo-thumb';
    thumb.appendChild(placeholderCanvas(50));
    getSprite(p,50).then(c=>{thumb.innerHTML='';thumb.appendChild(c);});
    const info = document.createElement('div'); info.className = 'philo-info';
    info.innerHTML = `<div class="philo-num">#${p.id}</div>
      <div class="philo-name">${p.nom}</div>
      <div class="philo-types">${dexTypes(p).map(tp=>`<span class="type-badge ${tClass(tp)}">${tp.substring(0,5).toUpperCase()}</span>`).join('')}</div>`;
    const gen = document.createElement('div'); gen.className = 'philo-gen';
    gen.textContent = p.era; gen.style.color = ERA_COLORS[p.era]||'#aaaaaa';
    const right = document.createElement('div'); right.className = 'philo-right';
    right.appendChild(gen);
    const badge = sortBadge(p, 'sort-val');
    if (badge) right.appendChild(badge);
    row.appendChild(thumb); row.appendChild(info); row.appendChild(right);
    row.addEventListener('click', ()=>openDesktopDetail(p));
    sidebar.appendChild(row);
  });

  // Card grid
  const grid = document.getElementById('desk-card-grid');
  grid.innerHTML = '';
  items.forEach(p => {
    const card = document.createElement('div');
    card.className = 'philo-card' + (selectedPhilo===p ? ' active':'');
    card.dataset.philoId = p.id;
    const spriteArea = document.createElement('div'); spriteArea.className = 'card-sprite-area';
    spriteArea.appendChild(placeholderCanvas(106));
    getSprite(p,106).then(c=>{spriteArea.innerHTML='';spriteArea.appendChild(c);});
    card.innerHTML = '';
    card.appendChild(spriteArea);
    const body = document.createElement('div'); body.className = 'card-body';
    body.innerHTML = `<div class="card-num">#${p.id}</div>
      <div class="card-name">${p.nom}</div>
      <div class="card-types">${dexTypes(p).map(tp=>`<span class="type-badge ${tClass(tp)}">${tp.substring(0,5).toUpperCase()}</span>`).join('')}</div>
      <div class="card-gen" style="color:${ERA_COLORS[p.era]||'#aaaaaa'}">${p.era}</div>`;
    card.appendChild(body);
    // Posée sur la carte et non dans la zone du sprite, que le chargement efface.
    const badge = sortBadge(p, 'card-sortval');
    if (badge) card.appendChild(badge);
    card.addEventListener('click', ()=>openDesktopDetail(p));
    grid.appendChild(card);
  });
}

function showDesktopEmpty() {
  document.querySelector('.desk-body').classList.add('detail-hidden');
  document.getElementById('desk-empty').style.display = 'flex';
  document.getElementById('desk-detail-content').classList.remove('visible');
}

// Sprite + typage de l'en-tête, au stade correspondant au niveau courant.
function paintDesktopHeader(p) {
  const si = stageIndexAtLevel(p, curLevel(p));
  const spriteEl = document.getElementById('desk-d-sprite');
  if (spriteEl) {
    const key = rawKey(p, si);
    const hadRaw = !!rawCache[key];
    spriteEl.innerHTML = '';
    spriteEl.appendChild(placeholderCanvas(120));
    getSprite(p, 120, si).then(c => {
      spriteEl.innerHTML = ''; spriteEl.appendChild(c);
      // Si le détail est ce qui a fini par charger l'image, on rafraîchit la carte.
      if (!hadRaw && rawCache[key] && si === dexStageIndex(p)) {
        delete spriteCache[`${rawKey(p, si)}_106`];
        delete spriteCache[`${rawKey(p, si)}_50`];
        const cardEl = document.querySelector(`.philo-card[data-philo-id="${p.id}"]`);
        const sa = cardEl && cardEl.querySelector('.card-sprite-area');
        if (sa) getSprite(p, 106, si).then(c2 => { sa.innerHTML = ''; sa.appendChild(c2); });
      }
    });
  }
  const tEl = document.getElementById('desk-d-types');
  if (tEl) tEl.innerHTML = typesAt(p, si).map(tp =>
    `<span class="type-badge ${tClass(tp)}">${tp.toUpperCase()}</span>`).join('');
  const stEl = document.getElementById('desk-d-stage');
  const st = stageOf(p, si);
  if (stEl) stEl.textContent = st ? stageTag(p, si) : '';
  paintInfluence(p, 'desk-d-infl', 'desk-d-infl-num');
  renderLifebar(p, document.getElementById('desk-lifebar'));
}

// L'influence est une réserve qui s'accumule : elle suit donc le niveau, et se
// repeint à chaque mouvement du curseur.
function paintInfluence(p, barId, numId) {
  const inf = statsAt(p, curLevel(p)).INFLUENCE;
  const num = document.getElementById(numId);
  const fill = document.getElementById(barId);
  if (num) num.textContent = inf;
  if (fill) {
    fill.style.width = inf + '%';
    fill.className = 'infl-fill ' + (inf >= 50 ? 'hi' : inf >= 25 ? 'mid' : 'low');
  }
}

// « II · LE PARADOXE » — le chiffre n'apparaît que si le philosophe a plusieurs formes.
function stageTag(p, si) {
  const st = stageOf(p, si);
  if (!st) return '';
  const nom = (st[lang] || st.fr).nom;
  return stageCount(p) > 1 ? `${['I','II','III','IV','V'][si] || (si + 1)} · ${nom}` : nom;
}

function tcRowHead(att) {
  const abbr = TYPE_ABBR[att] || att.substring(0,3).toUpperCase();
  const tail = att.slice(abbr.length);
  return `<span class="${tClass(att)}">${abbr}</span><span class="col-tail">${tail}</span>`;
}

function renderTypeChart() {
  const tc = PHILOMON_DATA.typechart;
  // Column order: all types grouped by champ
  const inChamps = new Set(Object.values(CHAMPS).flatMap(cd => cd.types));
  const allTypes = [
    ...Object.values(CHAMPS).flatMap(cd => cd.types),
    ...Object.keys(tc).filter(t => !inChamps.has(t)),
  ];

  // Compute column indices where a champ group ends (for right-border)
  const champBoundaries = new Set();
  let ci = 0;
  for (const cd of Object.values(CHAMPS)) { ci += cd.types.length; champBoundaries.add(ci - 1); }

  const legend = `<div class="typechart-legend">
    <div class="legend-item"><div class="legend-swatch x2">×2</div>SUPER EFFICACE</div>
    <div class="legend-item"><div class="legend-swatch half">×½</div>PEU EFFICACE</div>
    <div class="legend-item"><div class="legend-swatch immune">×0</div>IMMUNITÉ</div>
    <div class="legend-item"><div class="legend-swatch normal">×1</div>NORMAL</div>
  </div>`;

  const colHeaders = `<tr>
    <th class="corner">ATT ↓ / DEF →</th>
    ${allTypes.map((def, i) => {
      const abbr = TYPE_ABBR[def] || def.substring(0,3).toUpperCase();
      const sep = champBoundaries.has(i) ? ' style="border-right:2px solid #2a2a55"' : '';
      return `<th class="col-head"${sep}><span class="${tClass(def)}">${abbr}</span></th>`;
    }).join('')}
  </tr>`;

  let rows = '';
  // Rows grouped by champ
  for (const [champ, cd] of Object.entries(CHAMPS)) {
    rows += `<tr><th class="champ-separator" colspan="${allTypes.length + 1}" style="color:${cd.color};border-left-color:${cd.color}">${champ}</th></tr>`;
    for (const att of cd.types) {
      const cells = allTypes.map((def, i) => {
        const mult = tc[att]?.[def] ?? 1;
        let cls, label;
        if (mult === 0)       { cls = 'tcc-immune'; label = '×0'; }
        else if (mult >= 2)   { cls = 'tcc-x2';     label = '×2'; }
        else if (mult <= 0.5) { cls = 'tcc-half';   label = '×½'; }
        else                  { cls = 'tcc-normal';  label = '·';  }
        const sep = champBoundaries.has(i) ? ';border-right:2px solid #2a2a55' : '';
        return `<td class="${cls}" style="${sep.slice(1)}">${label}</td>`;
      }).join('');
      rows += `<tr><th class="row-head">${tcRowHead(att)}</th>${cells}</tr>`;
    }
  }
  // Orphan types not in any champ
  for (const att of Object.keys(tc)) {
    if (inChamps.has(att)) continue;
    const cells = allTypes.map((def, i) => {
      const mult = tc[att]?.[def] ?? 1;
      let cls, label;
      if (mult === 0)       { cls = 'tcc-immune'; label = '×0'; }
      else if (mult >= 2)   { cls = 'tcc-x2';     label = '×2'; }
      else if (mult <= 0.5) { cls = 'tcc-half';   label = '×½'; }
      else                  { cls = 'tcc-normal';  label = '·';  }
      const sep = champBoundaries.has(i) ? ';border-right:2px solid #2a2a55' : '';
      return `<td class="${cls}" style="${sep.slice(1)}">${label}</td>`;
    }).join('');
    rows += `<tr><th class="row-head">${tcRowHead(att)}</th>${cells}</tr>`;
  }

  document.getElementById('typechart-main').innerHTML =
    legend +
    `<div class="typechart-axis-hint">ATTAQUE ↓&nbsp;&nbsp;&nbsp;&nbsp;DÉFENSE →</div>
     <table class="typechart-table"><thead>${colHeaders}</thead><tbody>${rows}</tbody></table>`;
}

function computeBreedChildren() {
  if (!breedSlotA || !breedSlotB) return [];
  const nomA = breedSlotA.nom.toUpperCase();
  const nomB = breedSlotB.nom.toUpperCase();
  // Disciples lists with parentheticals stripped for matching
  const discA = (breedSlotA.fr.filiation?.disciples || []).map(x => x.replace(/\s*[\(,].*$/, '').trim().toUpperCase());
  const discB = (breedSlotB.fr.filiation?.disciples || []).map(x => x.replace(/\s*[\(,].*$/, '').trim().toUpperCase());
  return PHILOMON.filter(p => {
    if (p.id === breedSlotA.id || p.id === breedSlotB.id) return false;
    const nomC = p.nom.toUpperCase();
    const maitres = (p.fr.filiation?.maitres || []).map(m => m.toUpperCase());
    // D1: C lists both A and B as maitres
    const d1 = maitres.some(m => m.includes(nomA)) && maitres.some(m => m.includes(nomB));
    // D2: both A and B list C as disciple
    const d2 = discA.includes(nomC) && discB.includes(nomC);
    return d1 || d2;
  });
}

      const box = document.createElement('div');

      getSprite(child, 80).then(c => wrap.appendChild(c));
      box.innerHTML = `<span class="breed-result-label">ENFANT</span>`;
      box.appendChild(wrap);
      const name = document.createElement('span'); name.className = 'breed-result-name'; name.textContent = child.nom;
      box.appendChild(name);
      area.appendChild(box);
    });
  } else if (breedSlotA && breedSlotB) {
    area.innerHTML = `<div class="breed-result-box"><span class="breed-result-label">ENFANT</span><div class="breed-slot-canvas"><span class="breed-slot-empty-glyph" style="color:#663333">✕</span></div><span class="breed-result-name breed-sterile">STÉRILE</span></div>`;

  }
}
